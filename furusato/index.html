<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ふるさと納税">
<meta name="theme-color" content="#e39a4c">
<title>ふるさと納税きろく</title>
<style>
@font-face{font-family:"Azuki";src:url("../azukiP.ttf") format("truetype");font-display:swap;}

  :root{
    --bg:#fdf7ef; --card:#ffffff; --text:#4d4438; --sub:#a99b88;
    --accent:#e39a4c; --accent-dark:#c97f34; --mint:#a8d8c8;
    --ok:#7ec8a9; --warn:#eaa63f; --bad:#e08a6f; --line:#efe4d3;
    --shadow:0 2px 10px rgba(170,130,80,.13);
  }
  body.otto{ --accent:#6f9ec0; --accent-dark:#4f83a8; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Azuki","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--bg); color:var(--text);
    max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:84px;
  }
  header{text-align:center; padding:16px 16px 4px}
  header h1{font-size:20px; letter-spacing:1.5px; display:flex; align-items:center; justify-content:center; gap:8px}
  header h1 svg{width:26px; height:26px}

  .pbar{display:flex; gap:8px; padding:8px 16px 4px}
  .pbar .pb{flex:1; border:2px solid var(--accent-dark); background:#fff; border-radius:12px; padding:8px 0; font-family:inherit; font-size:14px; font-weight:bold; color:var(--accent-dark); cursor:pointer}
  .pbar .pb.on{background:var(--accent-dark); color:#fff}

  .yearbar{display:flex; align-items:center; justify-content:center; gap:16px; padding:8px 16px 10px}
  .yearbar button{border:none; background:var(--card); box-shadow:var(--shadow); width:32px; height:32px; border-radius:50%; font-size:16px; color:var(--accent-dark); font-family:inherit}
  .yearbar .yl{font-size:17px; font-weight:bold; min-width:96px; text-align:center}

  .summary{display:flex; gap:8px; padding:0 14px 12px}
  .summary .box{flex:1; background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:10px 6px; text-align:center}
  .summary .num{font-size:17px; font-weight:bold; color:var(--accent-dark)}
  .summary .num small{font-size:11px; font-weight:normal}
  .summary .label{font-size:10px; color:var(--sub); margin-top:2px}
  .summary .box.warn .num{color:var(--bad)}

  .tabbar{position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; display:flex; background:var(--card); box-shadow:0 -2px 10px rgba(170,130,80,.15); padding-bottom:env(safe-area-inset-bottom); z-index:5}
  .tabbar button{flex:1; border:none; background:none; padding:11px 0 9px; font-size:12px; color:var(--sub); font-family:inherit}
  .tabbar button .ico{display:flex; justify-content:center; margin-bottom:3px}
  .tabbar button .ico svg{width:22px; height:22px}
  .tabbar button.active{color:var(--accent-dark); font-weight:bold}

  .page{display:none; padding:0 14px}
  .page.active{display:block}
  .sec-note{font-size:12px; color:var(--sub); margin:10px 4px 8px; line-height:1.6}

  .card{background:var(--card); border-radius:16px; box-shadow:var(--shadow); margin-bottom:10px; padding:12px 14px}
  .d-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
  .d-muni{font-size:15.5px; font-weight:bold; flex:1; min-width:0}
  .d-amt{font-size:16px; font-weight:bold; color:var(--accent-dark); white-space:nowrap}
  .d-sub{font-size:11.5px; color:var(--sub); margin-top:2px}
  .d-gift{font-size:13px; margin-top:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .d-gift .gname{flex:1; min-width:0}
  .chip{border:1.5px solid var(--line); border-radius:999px; padding:4px 11px; font-size:11.5px; font-family:inherit; background:#fffdfa; color:var(--sub); cursor:pointer; white-space:nowrap}
  .chip.on{background:var(--ok); border-color:var(--ok); color:#fff}
  .chip.warnoff{border-color:#eccf9f; color:#c98f3f}
  .d-os{margin-top:8px; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
  .d-os .oslbl{font-size:11.5px; color:var(--sub)}
  .badge{display:inline-block; font-size:10.5px; padding:2px 8px; border-radius:999px; background:#f3ece0; color:#a2907a}
  .badge.kakutei{background:#eef1f6; color:#7c8aa0}
  .d-foot{display:flex; justify-content:flex-end; align-items:center; gap:4px; margin-top:8px}
  .chip.heart{border-color:#f3cfc9; color:#d98a82}
  .chip.heart.on{background:#f2a7a0; border-color:#f2a7a0; color:#fff}
  .d-rate{display:flex; align-items:center; gap:6px; margin-top:8px; font-size:11.5px; color:var(--sub)}
  .rchip{border:1.5px solid var(--line); border-radius:10px; padding:3px 10px; font-size:14px; background:#fffdfa; cursor:pointer; opacity:.4; filter:grayscale(1)}
  .rchip.on{opacity:1; filter:none; border-color:var(--accent); background:#fff6ea}
  .d-foot .w-go{color:var(--accent-dark); font-weight:bold}
  .card.cat-food{border-left:6px solid #ef9a6b}
  .card.cat-daily{border-left:6px solid #7fbf9a}
  .ctag{display:inline-block; font-size:10.5px; padding:2px 9px; border-radius:999px; margin-left:7px; vertical-align:middle; cursor:pointer; font-weight:normal}
  .ctag.food{background:#fde6d8; color:#d06f3c}
  .ctag.daily{background:#dff1e6; color:#4f9a6f}
  .ctag.none{background:#f3ece0; color:#b3a38c}
  .grp{display:flex; align-items:center; gap:8px; margin:16px 4px 8px}
  .grp.first{margin-top:4px}
  .grp-n{font-size:11.5px; color:var(--sub)}
  .ctag.pref{background:#f6ead9; color:#a7722f}
  .sortbar{display:flex; gap:6px; justify-content:flex-end; margin:2px 2px 0}
  .sortbar .sb{border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:4px 12px; font-family:inherit; font-size:11.5px; color:var(--sub); cursor:pointer}
  .sortbar .sb.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .d-photo{margin-top:8px}
  .thumb{width:72px; height:72px; border-radius:12px; object-fit:cover; border:1px solid var(--line); cursor:pointer; display:block}
  .lb{position:fixed; inset:0; background:rgba(40,30,20,.86); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:20; padding:20px}
  .lb.show{display:flex}
  .lb img{max-width:100%; max-height:74vh; border-radius:12px}
  .lb-bar{display:flex; gap:10px; margin-top:14px}
  .lb-bar button{border:none; border-radius:12px; padding:10px 18px; font-family:inherit; font-size:13px; background:#fff; color:var(--text)}
  .w-link{font-size:12px; color:var(--accent-dark); text-decoration:none; border-bottom:1px dashed var(--accent)}
  .d-foot button{border:none; background:none; color:#c9bda9; font-size:11.5px; font-family:inherit; padding:5px 7px}

  .form{background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:14px; margin-top:4px}
  .form h3{font-size:14px; color:var(--accent-dark); margin-bottom:10px}
  .fld{margin-bottom:9px}
  .fld label{font-size:11px; color:var(--sub); display:block; margin-bottom:3px}
  .fld input, .fld select{width:100%; border:1.5px solid var(--line); border-radius:11px; padding:9px 11px; font-family:inherit; font-size:13.5px; background:#fffdfa; color:var(--text); outline:none}
  .fld input:focus, .fld select:focus{border-color:var(--accent)}
  .fld.row{display:flex; gap:8px}
  .fld.row>div{flex:1}
  .osrow{display:flex; align-items:center; gap:8px; margin:4px 0 10px; font-size:13px; color:var(--text)}
  .osrow input{width:20px; height:20px; accent-color:var(--accent)}
  .save-btn{width:100%; border:none; background:var(--accent); color:#fff; font-family:inherit; font-weight:bold; font-size:14px; padding:11px; border-radius:12px}
  .cancel-btn{width:100%; border:none; background:none; color:var(--sub); font-family:inherit; font-size:12.5px; padding:8px; margin-top:2px}

  .limit-card{background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:14px; margin-bottom:12px}
  .limit-card h3{font-size:14px; color:var(--accent-dark); margin-bottom:8px}
  .limit-row{display:flex; gap:8px; align-items:center}
  .limit-row input{flex:1; border:1.5px solid var(--line); border-radius:11px; padding:9px 11px; font-family:inherit; font-size:14px; background:#fffdfa; color:var(--text); outline:none}
  .limit-row button{border:none; background:var(--mint); color:#fff; font-family:inherit; font-weight:bold; font-size:13px; padding:0 16px; border-radius:11px}
  .gauge{height:12px; border-radius:999px; background:#f1e8d9; overflow:hidden; margin-top:12px}
  .gauge span{display:block; height:100%; border-radius:999px; background:var(--accent); transition:width .3s}
  .gauge span.over{background:var(--bad)}
  .limit-info{font-size:12.5px; color:var(--sub); margin-top:8px; line-height:1.7}
  .limit-info b{color:var(--accent-dark); font-size:14px}

  .mtitle{font-size:13px; font-weight:bold; color:var(--text); margin:16px 4px 8px; display:flex; align-items:center; gap:6px}
  .brk{background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:6px 14px}
  .brk-row{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #f6efe4; font-size:13.5px}
  .brk-row:last-child{border-bottom:none}
  .brk-row .bl{color:var(--text)} .brk-row .bv{color:var(--accent-dark); font-weight:bold}
  .todo{background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:6px 14px}
  .todo-row{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid #f6efe4; font-size:13px}
  .todo-row:last-child{border-bottom:none}
  .todo-row .tdot{width:8px; height:8px; border-radius:50%; background:var(--warn); flex-shrink:0}
  .empty{text-align:center; color:var(--sub); font-size:13px; padding:30px 0; line-height:2}
  .allok{color:var(--ok); font-size:12.5px; padding:12px 2px; text-align:center}

  #toast{position:fixed; left:50%; bottom:92px; transform:translateX(-50%) translateY(20px); background:var(--text); color:#fff; font-size:14px; padding:12px 22px; border-radius:999px; opacity:0; pointer-events:none; transition:.3s; white-space:nowrap; z-index:10}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  .bkx{margin:18px 4px 30px; background:#fff; border:1px solid rgba(0,0,0,.07); border-radius:16px; padding:14px 16px; box-shadow:var(--shadow); font-size:12px; color:#9a8b76; line-height:1.7}
  .bkx h3{font-size:13.5px; color:#6b5a44; margin-bottom:4px; display:flex; align-items:center; gap:6px}
  .bkx h3 svg{width:18px; height:18px}
  .bkx .bkx-btn{border:none; border-radius:12px; padding:9px 16px; font-family:inherit; font-weight:700; font-size:12.5px; color:#fff; background:#cbb48f; margin:8px 8px 0 0; cursor:pointer}
  .bkx .bkx-btn.sub{background:#d8ccb6}
</style>
</head>
<body>
<header>
  <h1><span id="hIcon"></span>ふるさと納税きろく</h1>
</header>

<div class="pbar">
  <button class="pb on" data-p="watashi" onclick="setPerson('watashi')">私</button>
  <button class="pb" data-p="otto" onclick="setPerson('otto')">夫</button>
</div>

<div class="yearbar">
  <button onclick="moveYear(-1)">＜</button>
  <span class="yl" id="yearLabel">2026年</span>
  <button onclick="moveYear(1)">＞</button>
</div>
<div class="summary" id="summary"></div>

<div id="pageKiroku" class="page active"></div>
<div id="pageWish" class="page"></div>
<div id="pageMatome" class="page"></div>

<nav class="tabbar">
  <button id="tabKiroku" class="active" onclick="showPage('Kiroku')"><span class="ico" data-icon="gift"></span>きろく</button>
  <button id="tabWish" onclick="showPage('Wish')"><span class="ico" data-icon="star"></span>ほしい</button>
  <button id="tabMatome" onclick="showPage('Matome')"><span class="ico" data-icon="chart"></span>まとめ</button>
</nav>

<div id="toast"></div>
<div id="lb" class="lb" onclick="closeLb()"><img id="lbImg" alt=""><div class="lb-bar"><button onclick="event.stopPropagation();rmPhoto()">写真を消す</button><button onclick="closeLb()">とじる</button></div></div>

<div class="bkx">
  <h3><svg viewBox="0 0 48 48" fill="none" stroke="#6b5a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 7 V25 M17 19 L24 26 L31 19"/><path d="M8 29 V35 Q8 40 13 40 H35 Q40 40 40 35 V29"/></svg> データのバックアップ</h3>
  記録はこの端末のブラウザ内に保存されています。ときどきファイルに書き出しておくと、機種変更やお引っ越しでも安心です。<br>
  <button class="bkx-btn" id="bkxExp">書き出す</button><button class="bkx-btn sub" id="bkxImpBtn">読み込む</button>
  <input type="file" id="bkxImp" accept=".json" style="display:none">
</div>

<script>
const KEY = "furusato_v1";

const SVG_OPEN = '<svg viewBox="0 0 48 48" fill="none" stroke="#8a6f4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">';
const ICONS = {
  gift: SVG_OPEN+'<rect x="9" y="20" width="30" height="19" rx="3" fill="#f4d29a"/><path d="M9 26 H39" stroke-width="2.5"/><rect x="21" y="20" width="6" height="19" fill="#e39a4c" stroke="none"/><path d="M24 20 C24 20 16 20 16 14 C16 10 22 11 24 20 C26 11 32 10 32 14 C32 20 24 20 24 20 Z" fill="#f0b25f"/></svg>',
  chart: SVG_OPEN+'<path d="M9 39 H40"/><rect x="13" y="24" width="6" height="13" rx="1.5" fill="#f4d29a"/><rect x="22" y="17" width="6" height="20" rx="1.5" fill="#e39a4c"/><rect x="31" y="28" width="6" height="9" rx="1.5" fill="#f0b25f"/></svg>',
  star: SVG_OPEN+'<path d="M24 7 L29 18 L41 19.5 L32 27.5 L34.5 39.5 L24 33.5 L13.5 39.5 L16 27.5 L7 19.5 L19 18 Z" fill="#f4d29a"/></svg>',
  present: SVG_OPEN+'<rect x="10" y="12" width="28" height="26" rx="4" fill="#f4d29a"/><path d="M10 22 H38 M24 12 V38"/><path d="M24 12 C24 12 18 6 15 9 C12 12 18 14 24 12 C30 14 36 12 33 9 C30 6 24 12 24 12 Z" fill="#f0b25f"/></svg>',
};
const SITES = ["楽天ふるさと納税","さとふる","ふるなび","ふるさとチョイス","ふるさとプレミアム","au PAY ふるさと納税","Yahoo!ふるさと納税"];
const PLABEL = {watashi:"私", otto:"夫"};
const RMARK = {o:"⭕", t:"🔺", x:"❌"};
const CATS = {food:"食品", daily:"日用品"};
const PREFS = ["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];
var sortMode = (function(){ try{ return localStorage.getItem("furusato_sort")||"cat"; }catch(e){ return "cat"; } })();

let state = load();
let curPerson = "watashi";
let curYear = String(new Date().getFullYear());
let editId = null;

function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY));
    if(s && s.people){ ["watashi","otto"].forEach(function(p){ if(!s.people[p]) s.people[p]={items:[],limits:{}}; if(!Array.isArray(s.people[p].items)) s.people[p].items=[]; if(!s.people[p].limits) s.people[p].limits={}; }); return s; }
    if(s && Array.isArray(s.items)){ return { people:{ watashi:{items:s.items, limits:s.limits||{}}, otto:{items:[],limits:{}} } }; }
  }catch(e){}
  return { people:{ watashi:{items:[],limits:{}}, otto:{items:[],limits:{}} } };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); return true; }catch(e){ toast("容量がいっぱいで保存できなかった…写真を減らしてね"); return false; } }
function P(){ return state.people[curPerson]; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function yen(n){ return (n||0).toLocaleString("ja-JP"); }
function pad2(n){ return String(n).padStart(2,"0"); }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }

function itemsOf(y){ return P().items.filter(function(it){return (it.date||"").slice(0,4)===y;}); }
function totalOf(y){ return itemsOf(y).reduce(function(a,it){return a+(it.amt||0);},0); }
function muniKey(it){ var p=prefOf(it); var m=String(it.muni||"").split(" ").join("").split("　").join(""); if(p && m.indexOf(p)===0) m=m.slice(p.length); else if(p && p!=="北海道" && m.indexOf(p.slice(0,-1))===0) m=m.slice(p.length-1); return p+"|"+m; }
function osMunis(y){ var s={}; itemsOf(y).forEach(function(it){ if(it.oneStop) s[muniKey(it)]=1; }); return Object.keys(s); }

function setPerson(p){ curPerson=p; editId=null; pendingWish=null;
  document.body.classList.toggle("otto", p==="otto");
  document.querySelectorAll(".pbar .pb").forEach(function(b){ b.classList.toggle("on", b.dataset.p===p); });
  renderAll();
}
function moveYear(d){ curYear=String(parseInt(curYear,10)+d); editId=null; renderAll(); }

function renderTop(){
  document.getElementById("yearLabel").textContent = curYear+"年";
  var total=totalOf(curYear);
  var lim=P().limits[curYear]||0;
  var rem=lim-total;
  var osn=osMunis(curYear).length;
  var remBox = lim ? ('<div class="num">'+yen(rem)+'<small>円</small></div><div class="label">上限まで残り</div>')
                   : ('<div class="num" style="font-size:13px">未設定</div><div class="label">上限（まとめで設定）</div>');
  var remCls = (lim && rem<0) ? " warn" : "";
  var osCls = (osn>5) ? " warn" : "";
  document.getElementById("summary").innerHTML =
    '<div class="box"><div class="num">'+yen(total)+'<small>円</small></div><div class="label">今年の合計</div></div>'
    +'<div class="box'+remCls+'">'+remBox+'</div>'
    +'<div class="box'+osCls+'"><div class="num">'+osn+'<small>/5</small></div><div class="label">ワンストップ自治体</div></div>';
}

function renderKiroku(){
  var el=document.getElementById("pageKiroku");
  var list=itemsOf(curYear).slice().sort(function(a,b){ if(a.date!==b.date) return a.date<b.date?1:-1; return a.id<b.id?1:-1; });
  list.sort(function(a,b){ return grpKey(a)-grpKey(b); }); var lastG=null;
  var html = list.length ? '<div class="sortbar"><button class="sb'+(sortMode!=="pref"?" on":"")+'" onclick="setSort(&#39;cat&#39;)">分類ごと</button><button class="sb'+(sortMode==="pref"?" on":"")+'" onclick="setSort(&#39;pref&#39;)">県ごと</button></div>' : '';
  if(!list.length){ html+='<div class="empty">'+PLABEL[curPerson]+'の'+curYear+'年の記録はまだないよ。<br>下のフォームから追加してね🎁</div>'; }
  list.forEach(function(it){
    var g=grpKey(it); if(g!==lastG){ var grpArr=list.filter(function(x){return grpKey(x)===g;}); html+=(sortMode==="pref" ? prefHead(g, grpArr, lastG===null) : grpHead(g, grpArr, lastG===null)); lastG=g; }
    var giftPart='';
    if(it.gift){
      giftPart='<div class="d-gift"><span class="gname">🎁 '+esc(it.gift)+'</span>'
        +'<span class="chip'+(it.giftArrived?" on":" warnoff")+'" onclick="toggleField(&#39;'+it.id+'&#39;,&#39;giftArrived&#39;)">'+(it.giftArrived?"届いた✓":"まだ")+'</span></div>';
    }
    var osPart='';
    if(it.oneStop){
      osPart='<div class="d-os"><span class="oslbl">ワンストップ:</span>'
        +'<span class="chip'+(it.osReceived?" on":"")+'" onclick="toggleField(&#39;'+it.id+'&#39;,&#39;osReceived&#39;)">申請書 届いた'+(it.osReceived?"✓":"")+'</span>'
        +'<span class="chip'+(it.osSent?" on":"")+'" onclick="toggleField(&#39;'+it.id+'&#39;,&#39;osSent&#39;)">出した'+(it.osSent?"✓":"")+'</span></div>';
    }else{

function toggleField(id, field){
  var it=P().items.find(function(x){return x.id===id;}); if(!it) return;
  it[field]=!it[field]; save(); renderAll();
  if(it[field]) toast("できた！✓");
}
function findBy(kind, id){ var arr=(kind==="w")?W():P().items; return arr.find(function(x){return x.id===id;}); }
function pickPhoto(kind, id){
  var inp=document.createElement("input"); inp.type="file"; inp.accept="image/*";
  inp.onchange=function(){
    var f=inp.files[0]; if(!f) return; var rd=new FileReader();
    rd.onload=function(){ var img=new Image(); img.onload=function(){
      var w=img.width, h=img.height, mx=640;
      if(w>h && w>mx){ h=Math.round(h*mx/w); w=mx; } else if(h>=w && h>mx){ w=Math.round(w*mx/h); h=mx; }
      var c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
      var data=c.toDataURL("image/jpeg",0.72);
      var it=findBy(kind,id); if(!it) return; var old=it.photo; it.photo=data;
      if(save()){ toast("写真を貼ったよ📷"); } else { it.photo=old; }
      renderAll();
    }; img.src=rd.result; };
    rd.readAsDataURL(f);
  };
  inp.click();
}
var lbCur=null;
function openLb(kind, id){ var it=findBy(kind,id); if(!it||!it.photo) return; lbCur={kind:kind,id:id}; document.getElementById("lbImg").src=it.photo; document.getElementById("lb").classList.add("show"); }

function catTag(kind, it){ var c=it.cat||""; return '<span class="ctag '+(c||"none")+'" onclick="cycleCat(&#39;'+kind+'&#39;,&#39;'+it.id+'&#39;)">'+(c?CATS[c]:"分類")+'</span>'; }
function cycleCat(kind, id){ var arr=(kind==="w")?W():P().items; var it=arr.find(function(x){return x.id===id;}); if(!it) return; it.cat = !it.cat ? "food" : (it.cat==="food" ? "daily" : ""); save(); renderAll(); }
function prefFromText(s){ s=String(s||"").trim(); if(!s) return ""; for(var i=0;i<PREFS.length;i++){ if(s.indexOf(PREFS[i])===0) return PREFS[i]; } for(var j=0;j<PREFS.length;j++){ var p=PREFS[j]; if(p==="北海道") continue; var sh=p.slice(0,-1); if(sh.length>=2 && s.indexOf(sh)===0) return p; } return ""; }

function prefRank(it){ var i=PREFS.indexOf(prefOf(it)); return i<0?99:i; }

function prefHead(g, arr, first){ var lab = g<PREFS.length ? PREFS[g] : "県未設定"; var sum=arr.reduce(function(a,x){return a+(x.amt||0);},0); return '<div class="grp'+(first?" first":"")+'"><span class="ctag '+(g<PREFS.length?"pref":"none")+'" style="margin:0;cursor:default">'+lab+'</span><span class="grp-n">'+arr.length+'件・'+yen(sum)+'円</span></div>'; }
function setSort(m){ sortMode=m; try{ localStorage.setItem("furusato_sort", m); }catch(e){} renderKiroku(); }
function prefSelect(idn, cur){ return '<select id="'+idn+'"><option value="">未選択</option>'+PREFS.map(function(p){ return '<option'+(p===cur?" selected":"")+'>'+p+'</option>'; }).join("")+'</select>'; }
function autoPref(){ var p=prefFromText(document.getElementById("fMuni").value); if(p) document.getElementById("fPref").value=p; }
function catRank(it){ return it.cat==="food"?0:(it.cat==="daily"?1:2); }
function grpHead(g, arr, first){ var lab=["食品","日用品","分類なし"][g], cls=["food","daily","none"][g]; var sum=arr.reduce(function(a,x){return a+(x.amt||0);},0); return '<div class="grp'+(first?" first":"")+'"><span class="ctag '+cls+'" style="margin:0;cursor:default">'+lab+'</span><span class="grp-n">'+arr.length+'件・'+yen(sum)+'円</span></div>'; }

function delItem(id){

function saveItem(){

<script>
(function(){
  var APP="furusato";
  document.getElementById("bkxExp").addEventListener("click",function(){
    var data={};
    for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); data[k]=localStorage.getItem(k); }
    var blob=new Blob([JSON.stringify({__bkx:APP,data:data},null,2)],{type:"application/json"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    var d=new Date();
    a.download=APP+"-backup-"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+".json";
    a.click(); URL.revokeObjectURL(a.href);
  });
  document.getElementById("bkxImpBtn").addEventListener("click",function(){ document.getElementById("bkxImp").click(); });
  document.getElementById("bkxImp").addEventListener("change",function(ev){
    var f=ev.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var j=JSON.parse(r.result);
        var data=j.__bkx?j.data:j;
        if(typeof data!=="object"||!data) throw 0;
        if(!confirm("今の記録を読み込んだ内容で置き換えます。よろしいですか？")) return;
        Object.keys(data).forEach(function(k){ localStorage.setItem(k,data[k]); });
        alert("読み込みました。画面を更新します。"); location.reload();
      }catch(e){ alert("このファイルは読み込めませんでした"); }
    };
    r.readAsText(f); ev.target.value="";
  });
})();
</script>
