<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅行じゅんび">
<meta name="theme-color" content="#f3f0e8">
<title>旅行・おとまり じゅんび</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Yomogi&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Azuki";src:url("../azukiP.ttf") format("truetype");font-display:swap;}

  :root{
    --cream:#f3f0e8;--paper:#fffdf8;--ink:#514a40;--ink-soft:#9a9080;--ink-mid:#9a9080;
    --teal:#8fb6b0;--teal-deep:#5f938c;--coral:#e6a084;--coral-deep:#cf8064;
    --sand:#e3c692;--sand-deep:#c9a85c;--sun:#dd8f7f;--sat:#6f9aa8;
    --line:#e7e0d3;--shadow:rgba(120,105,80,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:"Azuki","Zen Maru Gothic",sans-serif;
    background:radial-gradient(circle at 12% 6%,rgba(143,182,176,.16),transparent 44%),
      radial-gradient(circle at 88% 94%,rgba(230,160,132,.13),transparent 44%),var(--cream);
    color:var(--ink);min-height:100dvh;padding:16px 13px 40px;display:flex;justify-content:center;}
  .app{width:100%;max-width:460px;}
  .head{text-align:center;margin:2px 0 14px;}
  .head .deco{font-family:"Yomogi",cursive;font-size:13px;color:var(--teal-deep);letter-spacing:.08em;}
  .head h1{font-weight:700;font-size:21px;letter-spacing:.03em;margin-top:3px;color:var(--teal-deep);}

  .page{display:none;animation:fade .28s ease;}
  .page.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* home: trip list */
  .add-trip{display:block;width:100%;font-family:inherit;font-weight:700;font-size:15px;color:#fff;
    background:var(--teal-deep);border:none;border-radius:15px;padding:14px;cursor:pointer;margin-bottom:16px;}
  .add-trip:active{transform:scale(.98);}
  .trip{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:15px 15px 13px;
    box-shadow:0 4px 14px var(--shadow);margin-bottom:12px;cursor:pointer;transition:.12s;}
  .trip:active{transform:scale(.98);}
  .trip .t-top{display:flex;align-items:baseline;gap:8px;}
  .trip .t-name{font-weight:700;font-size:16.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .trip .t-date{font-size:11.5px;color:var(--ink-soft);flex:0 0 auto;}
  .trip .t-bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:11px;}
  .trip .t-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--teal),var(--sand));border-radius:99px;transition:width .5s cubic-bezier(.34,1.4,.64,1);}
  .trip .t-cap{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);margin-top:5px;}
  .empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:34px 12px;font-family:"Yomogi",cursive;line-height:2;}

  /* trip detail */
  .t-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .back{width:38px;height:38px;flex:0 0 auto;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;
    font-size:18px;color:var(--ink-mid);cursor:pointer;}
  .t-head .th-mid{flex:1;min-width:0;}
  .t-head .th-name{font-weight:700;font-size:17px;color:var(--teal-deep);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .t-head .th-date{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
  .t-head .th-edit{flex:0 0 auto;border:none;background:transparent;color:var(--teal-deep);font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer;padding:6px;}

  .bigbar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:5px;}
  .bigfill{height:100%;width:0%;background:linear-gradient(90deg,var(--teal),var(--sand));border-radius:99px;transition:width .5s cubic-bezier(.34,1.4,.64,1);}
  .bigcap{text-align:center;font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
  .bigcap b{color:var(--teal-deep);font-size:15px;}

  .ptabs{display:flex;gap:5px;background:var(--line);padding:4px;border-radius:15px;margin-bottom:14px;}
  .ptab{flex:1;text-align:center;font-family:inherit;font-weight:700;font-size:13.5px;color:var(--ink-soft);
    background:transparent;border:none;padding:9px 0;border-radius:11px;cursor:pointer;transition:.2s;}
  .ptab.active{background:var(--paper);color:var(--ink);box-shadow:0 2px 6px var(--shadow);}

  .add-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:13px 12px;
    box-shadow:0 4px 12px var(--shadow);margin-bottom:16px;}
  .addrow{display:flex;gap:8px;}
  .addrow input{flex:1;font-family:inherit;font-size:15px;color:var(--ink);background:var(--cream);
    border:1.5px solid var(--line);border-radius:13px;padding:11px 13px;outline:none;-webkit-appearance:none;}
  .addrow input:focus{border-color:var(--teal);}
  .addrow button{flex:0 0 auto;font-family:inherit;font-weight:700;font-size:15px;color:#fff;
    background:var(--teal-deep);border:none;border-radius:13px;padding:0 17px;cursor:pointer;}
  .addrow button:active{transform:scale(.96);}
  .cat-lab{font-size:11px;font-weight:700;color:var(--ink-soft);margin:11px 2px 6px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink-soft);background:var(--cream);
    border:1.5px solid var(--line);border-radius:99px;padding:8px 12px;cursor:pointer;transition:.15s;}
  .chip.sel{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff;}
  .chip.add{border-style:dashed;font-weight:400;}
  .chip.editing{border-color:#e0a9a4;color:#c4756f;}
  .chip:active{transform:scale(.95);}

  .cat-head{display:flex;align-items:center;gap:8px;margin:16px 4px 8px;}
  .cat-head .ch-dot{width:9px;height:9px;border-radius:3px;background:var(--teal-deep);flex:0 0 auto;}
  .cat-head .ch-name{font-weight:700;font-size:14px;color:var(--teal-deep);}
  .cat-head .ch-cnt{margin-left:auto;font-size:11px;color:var(--ink-soft);}

  .pi{display:flex;align-items:center;gap:11px;background:var(--paper);border:1px solid var(--line);
    border-radius:15px;padding:12px 13px;box-shadow:0 3px 9px var(--shadow);margin-bottom:8px;transition:.15s;}
  .pi.done{opacity:.6;}
  .pi .box{flex:0 0 auto;width:28px;height:28px;border:2px solid var(--teal);border-radius:9px;background:var(--paper);
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .pi .box svg{width:17px;height:17px;opacity:0;}
  .pi.done .box{background:var(--teal-deep);border-color:var(--teal-deep);}
  .pi.done .box svg{opacity:1;}
  .pi .box:active{transform:scale(.9);}
  .pi .p-name{flex:1;font-size:15px;}
  .pi.done .p-name{text-decoration:line-through;text-decoration-color:var(--teal);}
  .pi .del{flex:0 0 auto;width:26px;height:26px;border:none;background:transparent;color:var(--ink-soft);
    font-size:17px;cursor:pointer;border-radius:50%;opacity:.4;}
  .pi .del:active{opacity:1;background:var(--line);}

  .copy-btn{display:block;width:100%;font-family:inherit;font-weight:700;font-size:13px;color:var(--coral-deep);
    background:#fdeee7;border:1.5px solid #f2d3c6;border-radius:13px;padding:11px;cursor:pointer;margin-top:8px;}
  .copy-btn:active{transform:scale(.98);}
  .tip{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:16px;line-height:1.8;}

  /* trip edit sheet */
  .sheet-bg{position:fixed;inset:0;background:rgba(60,55,45,.42);opacity:0;pointer-events:none;transition:.25s;z-index:40;}
  .sheet-bg.show{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(100%);width:100%;max-width:460px;
    background:var(--cream);border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(100,90,70,.25);
    z-index:50;transition:transform .3s cubic-bezier(.34,1.3,.64,1);padding:18px 16px 26px;max-height:90dvh;overflow-y:auto;}
  .sheet.show{transform:translateX(-50%) translateY(0);}
  .sheet h3{font-size:16px;color:var(--teal-deep);margin-bottom:14px;}
  .sheet .f-label{font-size:12px;font-weight:700;color:var(--ink-soft);margin:12px 2px 6px;}
  .sheet .f-label:first-of-type{margin-top:0;}
  .sheet input{width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:var(--paper);
    border:1.5px solid var(--line);border-radius:13px;padding:12px 13px;outline:none;-webkit-appearance:none;}
  .sheet input:focus{border-color:var(--teal);}
  .s-actions{display:flex;gap:9px;margin-top:18px;}
  .s-actions button{flex:1;font-family:inherit;font-weight:700;font-size:15px;border:none;border-radius:14px;padding:14px;cursor:pointer;}
  .s-actions .save{background:var(--teal-deep);color:#fff;}
  .s-actions .del{flex:0 0 auto;background:transparent;color:var(--coral-deep);border:1.5px solid #eecabf;padding:14px 16px;}
  .s-actions button:active{transform:scale(.97);}

  .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(80px);background:var(--ink);
    color:#fff;font-size:14px;font-weight:500;padding:12px 22px;border-radius:99px;box-shadow:0 6px 20px var(--shadow);
    z-index:80;opacity:0;transition:.35s cubic-bezier(.34,1.56,.64,1);max-width:90vw;text-align:center;}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

  .bkx{margin:20px 2px 100px;background:var(--paper);border:1px solid var(--line);border-radius:18px;
    padding:14px 16px;box-shadow:0 4px 12px var(--shadow);font-size:12px;color:var(--ink-soft);line-height:1.7}
  .bkx h3{font-size:13.5px;color:var(--ink);margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .bkx h3 svg{width:18px;height:18px}
  .bkx .bkx-btn{border:none;border-radius:12px;padding:9px 16px;font-family:inherit;font-weight:700;
    font-size:12.5px;color:#fff;background:var(--teal);margin:8px 8px 0 0;cursor:pointer}
  .bkx .bkx-btn.sub{background:#cfc6b6}
</style>

<body>
<div class="app">
  <div class="head">
    <div class="deco">＼ わすれものゼロで いってらっしゃい ／</div>
    <h1>旅行・おとまり じゅんび</h1>
  </div>

  <!-- ===== home: trips ===== -->
  <div class="page active" id="page-home">
    <button class="add-trip" id="newTripBtn">＋ 新しい旅行をつくる</button>
    <div id="tripList"></div>
  </div>

  <!-- ===== trip detail ===== -->
  <div class="page" id="page-trip">
    <div class="t-head">
      <button class="back" id="backBtn">‹</button>
      <div class="th-mid">
        <div class="th-name" id="thName"></div>
        <div class="th-date" id="thDate"></div>
      </div>
      <button class="th-edit" id="thEdit">編集</button>
    </div>
    <div class="bigbar"><div class="bigfill" id="bigFill"></div></div>
    <div class="bigcap" id="bigCap"></div>

    <div class="ptabs" id="pTabs"></div>

    <div class="add-card">
      <div class="addrow">
        <input type="text" id="fItem" placeholder="例：歯ブラシ、着替え、充電器" maxlength="24">
        <button id="addItemBtn">追加</button>
      </div>
      <div class="cat-lab">カテゴリ</div>
      <div class="chips" id="catChips"></div>
    </div>

    <div id="itemList"></div>
    <button class="copy-btn" id="copyBtn">📋 他の旅行から持ち物をコピー</button>
    <div class="tip">カバンに入れたら□をタップ！<br>チェックすると下に下がって、残りがひとめでわかるよ。</div>
  </div>
</div>

<!-- trip edit sheet -->
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <h3 id="sheetTitle">新しい旅行</h3>
  <div class="f-label">旅行の名前</div>
  <input type="text" id="tName" placeholder="例：夏の温泉、おばあちゃんち" maxlength="24">
  <div class="f-label">出発日（なくてもOK）</div>
  <input type="date" id="tStart">
  <div class="f-label">帰る日（なくてもOK）</div>
  <input type="date" id="tEnd">
  <div class="s-actions">
    <button class="save" id="tSave">保存する</button>
    <button class="del" id="tDel" style="display:none">削除</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY="tabi_app_v1";
const PEOPLE=["共通","Saku","Ao","ママ"];
const DEFAULT_CATS=["衣類","洗面・お風呂","薬・救急","電子機器","書類・お金","こども用品","その他"];
/* trip: {id,name,start,end,items:[{id,person,cat,name,done,order}]} */
let state={trips:[],cats:null};
let curTrip=null, curPerson="共通", selCat="", editCats=false, editingTripId=null;

async function storeGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
async function storeSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
async function load(){
  try{const v=await storeGet(KEY);if(v)state=Object.assign(state,JSON.parse(v));}catch(e){}
  if(!Array.isArray(state.trips))state.trips=[];
  if(!Array.isArray(state.cats)||!state.cats.length)state.cats=DEFAULT_CATS.slice();
  selCat=state.cats[0]||"";
  renderTrips();
}
async function save(){try{await storeSet(KEY,JSON.stringify(state));}catch(e){}}
function esc(s){return(""+s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
let toastT;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2200);}
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13 L10 18 L19 6"/></svg>';

function fmtRange(s,e){
  function md(d){const p=d.split("-");return p.length===3?(parseInt(p[1],10)+"/"+parseInt(p[2],10)):"";}
  if(s&&e)return md(s)+"〜"+md(e);
  if(s)return md(s)+"〜";
  if(e)return "〜"+md(e);
  return "";
}
function tripCounts(tr){let done=0,total=0;(tr.items||[]).forEach(it=>{total++;if(it.done)done++;});return {done,total};}

/* ===== home ===== */
function renderTrips(){
  const w=document.getElementById("tripList");
  if(state.trips.length===0){
    w.innerHTML='<div class="empty">まだ旅行がないよ。<br>上のボタンから追加してね ✈</div>';return;
  }
  let html="";
  state.trips.forEach(tr=>{
    const c=tripCounts(tr);const pct=c.total?Math.round(c.done/c.total*100):0;
    const dr=fmtRange(tr.start,tr.end);
    html+='<div class="trip" data-id="'+tr.id+'">'
      +'<div class="t-top"><div class="t-name">'+esc(tr.name)+'</div>'+(dr?'<div class="t-date">'+dr+'</div>':'')+'</div>'
      +'<div class="t-bar"><div class="t-fill" style="width:'+pct+'%"></div></div>'
      +'<div class="t-cap"><span>'+(c.total?("じゅんび "+c.done+"／"+c.total):"持ち物はこれから")+'</span><span>'+(c.total?pct+"%":"")+'</span></div>'
      +'</div>';
  });
  w.innerHTML=html;
  w.querySelectorAll(".trip").forEach(el=>el.addEventListener("click",()=>openTrip(el.dataset.id)));
}

/* ===== trip detail ===== */
function findTrip(id){return state.trips.find(t=>t.id==id)||null;}
function openTrip(id){
  curTrip=findTrip(id);if(!curTrip)return;
  if(!Array.isArray(curTrip.items))curTrip.items=[];
  curPerson="共通";selCat=state.cats[0]||"";editCats=false;
  document.getElementById("page-home").classList.remove("active");
  document.getElementById("page-trip").classList.add("active");
  window.scrollTo(0,0);
  renderTrip();
}
function backHome(){
  curTrip=null;
  document.getElementById("page-trip").classList.remove("active");
  document.getElementById("page-home").classList.add("active");
  renderTrips();
}
document.getElementById("backBtn").addEventListener("click",backHome);

function renderTrip(){
  if(!curTrip)return;
  document.getElementById("thName").textContent=curTrip.name;
  const dr=fmtRange(curTrip.start,curTrip.end);
  document.getElementById("thDate").textContent=dr||"日付はまだ";
  const c=tripCounts(curTrip);const pct=c.total?Math.round(c.done/c.total*100):0;
  document.getElementById("bigFill").style.width=pct+"%";
  document.getElementById("bigCap").innerHTML=c.total?('じゅんび <b>'+c.done+'</b> ／ '+c.total+' 個'+(c.done===c.total?'　ぜんぶOK！✨':'')):'持ち物を追加してね';
  renderPTabs();renderCatChips();renderItems();
}
function renderPTabs(){
  const w=document.getElementById("pTabs");w.innerHTML="";
  PEOPLE.forEach(p=>{
    const items=(curTrip.items||[]).filter(it=>it.person===p);
    const c=items.length;const done=items.filter(it=>it.done).length;
    const b=document.createElement("button");
    b.className="ptab"+(p===curPerson?" active":"");
    b.textContent=p+(c?"("+done+"/"+c+")":"");
    b.addEventListener("click",()=>{curPerson=p;editCats=false;renderTrip();});
    w.appendChild(b);
  });
}
function renderCatChips(){
  const w=document.getElementById("catChips");w.innerHTML="";
  state.cats.forEach(n=>{
    const b=document.createElement("button");
    b.className="chip"+(n===selCat&&!editCats?" sel":"")+(editCats?" editing":"");
    b.textContent=n+(editCats?" ×":"");
    b.addEventListener("click",async()=>{
      if(editCats){
        const used=countCat(n);
        const other=state.cats[state.cats.length-1];
        const msg=used?("「"+n+"」を消す？\n（"+used+"個は「"+(other===n?"その他":other)+"」に移動するよ）"):("「"+n+"」を消す？");
        if(!confirm(msg))return;
        let moveTo;
        if(state.cats.filter(x=>x!==n).length===0){state.cats=["その他"];moveTo="その他";}
        else{state.cats=state.cats.filter(x=>x!==n);moveTo=state.cats[state.cats.length-1];}
        state.trips.forEach(t=>(t.items||[]).forEach(it=>{if(it.cat===n)it.cat=moveTo;}));
        if(selCat===n)selCat=state.cats[0]||"";
        await save();renderTrip();
      }else{selCat=n;renderCatChips();}
    });
    w.appendChild(b);
  });
  const add=document.createElement("button");
  add.className="chip add";add.textContent="＋ 追加";
  add.addEventListener("click",async()=>{
    const n=(prompt("新しいカテゴリの名前は？")||"").trim();
    if(!n)return;
    if(state.cats.indexOf(n)>=0){toast("もうあるよ");return;}
    state.cats.push(n);selCat=n;editCats=false;
    await save();renderTrip();toast("「"+n+"」を追加したよ");
  });
  w.appendChild(add);
  const ed=document.createElement("button");
  ed.className="chip add"+(editCats?" sel":"");
  ed.textContent=editCats?"完了":"編集";
  ed.addEventListener("click",()=>{editCats=!editCats;renderCatChips();});
  w.appendChild(ed);
}
function countCat(n){let c=0;state.trips.forEach(t=>(t.items||[]).forEach(it=>{if(it.cat===n)c++;}));return c;}

function renderItems(){
  const w=document.getElementById("itemList");
  const mine=(curTrip.items||[]).filter(it=>it.person===curPerson);
  if(mine.length===0){
    w.innerHTML='<div class="empty">「'+esc(curPerson)+'」の持ち物はまだないよ。<br>上の欄から追加してね ✎</div>';return;
  }
  const names=state.cats.slice();
  mine.forEach(it=>{if(it.cat&&names.indexOf(it.cat)<0)names.push(it.cat);});
  let html="";
  names.forEach(n=>{
    const g=mine.filter(it=>it.cat===n).sort((a,b)=>{
      if(a.done!==b.done)return a.done?1:-1;   // 未チェックが上
      return (a.order||0)-(b.order||0);
    });
    if(!g.length)return;
    const done=g.filter(it=>it.done).length;
    html+='<div class="cat-head"><span class="ch-dot"></span><span class="ch-name">'+esc(n)+'</span><span class="ch-cnt">'+done+'／'+g.length+'</span></div>';
    g.forEach(it=>{
      html+='<div class="pi'+(it.done?" done":"")+'">'
        +'<button class="box" data-id="'+it.id+'" data-act="chk">'+CHECK+'</button>'
        +'<div class="p-name">'+esc(it.name)+'</div>'
        +'<button class="del" data-id="'+it.id+'" data-act="del">×</button>'
        +'</div>';
    });
  });
  w.innerHTML=html;
  w.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",async()=>{
    const it=(curTrip.items||[]).find(x=>x.id==b.dataset.id);if(!it)return;
    if(b.dataset.act==="chk"){it.done=!it.done;}
    else{if(!confirm("「"+it.name+"」を消す？"))return;curTrip.items=curTrip.items.filter(x=>x.id!=it.id);}
    await save();renderTrip();
  }));
}

/* add item */
async function addItem(){
  const inp=document.getElementById("fItem");const name=inp.value.trim();
  if(!name){toast("持ち物の名前を入れてね");return;}
  if(!selCat){toast("カテゴリを選んでね");return;}
  const maxo=(curTrip.items||[]).reduce((m,x)=>Math.max(m,x.order||0),0);
  curTrip.items.push({id:Date.now()+"_"+Math.random().toString(36).slice(2,6),person:curPerson,cat:selCat,name:name,done:false,order:maxo+1});
  inp.value="";
  await save();renderTrip();toast("「"+name+"」を追加したよ");
}
document.getElementById("addItemBtn").addEventListener("click",addItem);
document.getElementById("fItem").addEventListener("keydown",e=>{if(e.key==="Enter")addItem();});

/* copy from another trip */
document.getElementById("copyBtn").addEventListener("click",async()=>{
  const others=state.trips.filter(t=>t.id!=curTrip.id&&(t.items||[]).length);
  if(!others.length){toast("コピーできる旅行がまだないよ");return;}
  const list=others.map((t,i)=>(i+1)+". "+t.name+"（"+(t.items.length)+"個）").join("\n");
  const ans=(prompt("どの旅行の持ち物をコピーする？\n番号を入れてね：\n\n"+list)||"").trim();
  const idx=parseInt(ans,10)-1;
  if(isNaN(idx)||idx<0||idx>=others.length)return;
  const src=others[idx];
  let n=0;let maxo=(curTrip.items||[]).reduce((m,x)=>Math.max(m,x.order||0),0);
  src.items.forEach(it=>{
    const dup=curTrip.items.some(x=>x.person===it.person&&x.name===it.name);
    if(!dup){maxo++;curTrip.items.push({id:Date.now()+"_"+Math.random().toString(36).slice(2,6),person:it.person,cat:it.cat,name:it.name,done:false,order:maxo});n++;}
  });
  await save();renderTrip();toast(n?("「"+src.name+"」から "+n+"個コピーしたよ"):"新しく増える持ち物はなかったよ");
});

/* ===== trip edit sheet ===== */
function openSheet(trip){
  editingTripId=trip?trip.id:null;
  document.getElementById("sheetTitle").textContent=trip?"旅行を編集":"新しい旅行";
  document.getElementById("tName").value=trip?trip.name:"";
  document.getElementById("tStart").value=trip?(trip.start||""):"";
  document.getElementById("tEnd").value=trip?(trip.end||""):"";
  document.getElementById("tDel").style.display=trip?"":"none";
  document.getElementById("sheetBg").classList.add("show");
  document.getElementById("sheet").classList.add("show");
}
function closeSheet(){document.getElementById("sheetBg").classList.remove("show");document.getElementById("sheet").classList.remove("show");editingTripId=null;}
document.getElementById("newTripBtn").addEventListener("click",()=>openSheet(null));
document.getElementById("thEdit").addEventListener("click",()=>{if(curTrip)openSheet(curTrip);});
document.getElementById("sheetBg").addEventListener("click",closeSheet);
document.getElementById("tSave").addEventListener("click",async()=>{
  const name=document.getElementById("tName").value.trim();
  const start=document.getElementById("tStart").value;
  const end=document.getElementById("tEnd").value;
  if(!name){toast("旅行の名前を入れてね");return;}
  if(editingTripId){
    const tr=findTrip(editingTripId);if(tr){tr.name=name;tr.start=start;tr.end=end;}
    await save();closeSheet();if(curTrip&&curTrip.id==editingTripId)renderTrip();renderTrips();toast("保存したよ");
  }else{
    const tr={id:Date.now()+"_"+Math.random().toString(36).slice(2,6),name:name,start:start,end:end,items:[]};
    state.trips.unshift(tr);await save();closeSheet();renderTrips();openTrip(tr.id);toast("旅行をつくったよ ✈");
  }
});
document.getElementById("tDel").addEventListener("click",async()=>{
  if(!editingTripId)return;
  const tr=findTrip(editingTripId);
  if(!confirm("「"+(tr?tr.name:"")+"」を消す？\n（持ち物リストも全部消えるよ）"))return;
  state.trips=state.trips.filter(t=>t.id!=editingTripId);
  const wasCur=curTrip&&curTrip.id==editingTripId;
  await save();closeSheet();
  if(wasCur)backHome();else renderTrips();
  toast("消したよ");
});

load();
</script>

<div class="bkx">
  <h3><svg viewBox="0 0 48 48" fill="none" stroke="#8a7f6c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 7 V25 M17 19 L24 26 L31 19"/><path d="M8 29 V35 Q8 40 13 40 H35 Q40 40 40 35 V29"/></svg> データのバックアップ</h3>
  旅行と持ち物リストはこの端末のブラウザ内に保存されています。ときどきファイルに書き出しておくと、機種変更やアプリのお引っ越しでも安心です。<br>
  <button class="bkx-btn" id="bkxExp">書き出す</button><button class="bkx-btn sub" id="bkxImpBtn">読み込む</button>
  <input type="file" id="bkxImp" accept=".json" style="display:none">
</div>
<script>
(function(){
  var APP="tabi";
  var _b=document.querySelector(".bkx"),_ap=document.querySelector(".app");if(_b&&_ap)_ap.appendChild(_b);
  document.getElementById("bkxExp").addEventListener("click",function(){
    var data={};
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);data[k]=localStorage.getItem(k);}
    var blob=new Blob([JSON.stringify({__bkx:APP,data:data},null,2)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);
    var d=new Date();
    a.download=APP+"-backup-"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+".json";
    a.click();URL.revokeObjectURL(a.href);
  });
  document.getElementById("bkxImpBtn").addEventListener("click",function(){document.getElementById("bkxImp").click();});
  document.getElementById("bkxImp").addEventListener("change",function(ev){
    var f=ev.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var j=JSON.parse(r.result);
        var data=j.__bkx?j.data:j;
        if(typeof data!=="object"||!data)throw 0;
        if(!confirm("今の内容を読み込んだ内容で置き換えます。よろしいですか？"))return;
        Object.keys(data).forEach(function(k){localStorage.setItem(k,data[k]);});
        alert("読み込みました。画面を更新します。");location.reload();
      }catch(e){alert("このファイルは読み込めませんでした");}
    };
    r.readAsText(f);ev.target.value="";
  });
})();
</script>
