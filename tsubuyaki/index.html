<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="つぶやきメモ">
<meta name="theme-color" content="#a8968a">
<title>つぶやきメモ</title>
<style>
@font-face{font-family:"Azuki";src:url("../azukiP.ttf") format("truetype");font-display:swap;}
@font-face{font-family:"Uzura";src:url("../uzura.ttf") format("truetype");font-display:swap;}
  :root{
    --bg:#f5f1ec; --card:#fffdfa; --text:#5a5049; --sub:#a89c90; --line:#e8e0d6;
    --accent:#a8968a; --accent-dark:#8a776b;
    --shadow:0 2px 10px rgba(120,100,80,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--font,"Azuki"),"Azuki","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:40px}
  header{text-align:center;padding:16px 16px 6px;position:relative}
  .fontbtn{position:absolute;right:12px;top:14px;border:none;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:6px 11px;font-family:inherit;font-size:12px;color:var(--accent-dark);cursor:pointer}
  .fopt{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--card);border:2px solid transparent;border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;color:var(--text);text-align:left}
  .fopt.sel{border-color:var(--accent-dark)}
  .fopt .fn{font-size:18px}
  .fopt .fl{font-size:11px;color:var(--sub);font-family:"Hiragino Sans",sans-serif}
  header h1{font-size:20px;letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:8px}
  header h1 svg{width:28px;height:28px}
  header .deco{font-size:11px;color:var(--sub);letter-spacing:1px}

  .compose{margin:8px 12px 10px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:12px 12px 10px;border:2px solid var(--cbd,#e8e0d6);transition:border-color .2s}
  .compose textarea{width:100%;border:none;outline:none;resize:none;font-family:inherit;font-size:16px;color:var(--text);background:transparent;min-height:56px;line-height:1.6}
  .compose textarea::placeholder{color:#c4b8ac}
  .gchips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
  .gchips::-webkit-scrollbar{display:none}
  .gchip{flex:0 0 auto;border:2px solid transparent;border-radius:999px;padding:5px 12px;font-family:inherit;font-size:13px;color:var(--text);cursor:pointer;white-space:nowrap}
  .gchip.sel{border-color:currentColor;font-weight:bold}
  .gchip.add{background:#fff;border:1.5px dashed var(--line);color:var(--sub)}
  .crow{display:flex;align-items:center;gap:8px;margin-top:4px}
  .ibtn{border:none;background:none;cursor:pointer;padding:4px;display:inline-flex;align-items:center;justify-content:center}
  .ibtn svg{width:24px;height:24px}
  .prev{position:relative;display:inline-block;margin-top:6px}
  .prev img{max-height:110px;max-width:160px;border-radius:12px;display:block}
  .prev button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:none;background:#8a776b;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
  .send{margin-left:auto;border:none;border-radius:999px;padding:9px 20px;background:var(--accent-dark);color:#fff;font-family:inherit;font-size:15px;font-weight:bold;cursor:pointer;letter-spacing:1px}
  .send:disabled{opacity:.4}

  .tools{display:flex;align-items:center;gap:8px;margin:4px 12px 6px}
  .search{flex:1;display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 12px;box-shadow:var(--shadow)}
  .search svg{width:18px;height:18px;flex:0 0 auto}
  .search input{flex:1;min-width:0;border:none;outline:none;font-family:inherit;font-size:15px;background:transparent;color:var(--text)}
  .search button{border:none;background:none;color:var(--sub);font-size:16px;cursor:pointer;font-family:inherit}
  .tbtn{border:none;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:7px 12px;font-family:inherit;font-size:12.5px;color:var(--accent-dark);cursor:pointer;white-space:nowrap}
  .tbtn.on{background:var(--accent-dark);color:#fff}
  .filter{margin:0 12px 4px}

  .sec{font-size:12px;color:var(--sub);margin:14px 18px 6px;letter-spacing:1px;display:flex;align-items:center;gap:6px}
  .sec:after{content:"";flex:1;border-top:1.5px dashed var(--line)}
  .memo{margin:0 12px 10px;border-radius:18px;padding:12px 14px 8px;box-shadow:var(--shadow);position:relative;border-left:6px solid var(--deep)}
  .memo .txt{font-size:15.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
  .memo img{display:block;max-width:100%;max-height:260px;border-radius:12px;margin-top:8px;cursor:pointer}
  .memo .meta{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11.5px;color:rgba(70,60,50,.55)}
  .memo .gl{border-radius:999px;padding:2px 9px;background:rgba(255,255,255,.6);color:var(--deep);font-size:11.5px}
  .memo .acts{margin-left:auto;display:flex;gap:2px}
  .memo .acts .ibtn svg{width:21px;height:21px}
  .memo.done .txt{text-decoration:line-through;opacity:.5}
  .memo.done img{opacity:.5}
  .memo.pin:before{content:"";position:absolute;top:-5px;right:16px;width:14px;height:14px;border-radius:50%;background:var(--deep);box-shadow:0 2px 3px rgba(0,0,0,.15)}
  .memo .chk{float:left;margin:1px 8px 0 -2px}
  .memo .chk svg{width:24px;height:24px}
  .memo textarea{width:100%;border:1.5px solid rgba(0,0,0,.08);border-radius:12px;padding:8px;font-family:inherit;font-size:15.5px;line-height:1.6;background:rgba(255,255,255,.7);color:var(--text);resize:vertical;min-height:80px;outline:none}
  .ebtns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
  .ebtns button{border:none;border-radius:999px;padding:7px 16px;font-family:inherit;font-size:13.5px;cursor:pointer}
  .ebtns .ok{background:var(--deep);color:#fff}
  .ebtns .ng{background:rgba(255,255,255,.7);color:var(--text)}
  .empty{text-align:center;color:var(--sub);font-size:14px;padding:40px 20px;line-height:1.9}

  .sheet-bg{position:fixed;inset:0;background:rgba(60,50,40,.35);display:none;z-index:50;align-items:flex-end;justify-content:center}
  .sheet-bg.on{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:16px 16px 28px;max-height:85vh;overflow-y:auto}
  .sheet h2{font-size:16px;text-align:center;margin-bottom:10px}
  .grow{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:8px 10px;margin-bottom:8px}
  .grow input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:7px 9px;font-family:inherit;font-size:15px;color:var(--text);outline:none}
  .grow .sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;flex:0 0 auto}
  .grow .del{border:none;background:#efe5e2;color:#a5746c;border-radius:10px;padding:7px 10px;font-family:inherit;cursor:pointer}
  .pal{display:flex;flex-wrap:wrap;gap:8px;padding:6px 4px 10px}
  .pal span{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
  .pal span.sel{box-shadow:0 0 0 3px var(--accent-dark)}
  .sbtn{width:100%;border:none;border-radius:14px;padding:11px;font-family:inherit;font-size:15px;cursor:pointer;margin-top:6px}
  .sbtn.main{background:var(--accent-dark);color:#fff}
  .sbtn.sub{background:var(--card);color:var(--accent-dark)}
  .viewer{position:fixed;inset:0;background:rgba(30,25,20,.85);display:none;z-index:60;align-items:center;justify-content:center;padding:16px}
  .viewer.on{display:flex}
  .viewer img{max-width:100%;max-height:100%;border-radius:12px}

  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:rgba(90,80,73,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:70;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .bkx{margin:24px 12px 30px;background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);font-size:12px;color:#9a8b7e;line-height:1.7}
  .bkx h3{font-size:13.5px;color:#6b5d52;margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .bkx h3 svg{width:18px;height:18px}
  .bkx .bkx-btn{border:none;border-radius:12px;padding:9px 16px;font-family:inherit;font-weight:700;font-size:12.5px;color:#fff;background:#b9a99b;margin:8px 8px 0 0;cursor:pointer}
  .bkx .bkx-btn.sub{background:#d3c8bd}
</style>
</head>
<body>
<header>
  <button class="fontbtn" onclick="openFonts()">Aa 文字</button>
  <div class="deco">＼ 思いついたら すぐメモ ／</div>
  <h1><svg viewBox="0 0 48 48" fill="none" stroke="#8a776b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11 Q9 7 13 7 H35 Q39 7 39 11 V29 Q39 33 35 33 H22 L13 41 V33 Q9 33 9 29 Z" fill="#eadfd6"/><path d="M16 17 H32 M16 24 H27"/></svg>つぶやきメモ</h1>
</header>

<div class="compose" id="compose">
  <textarea id="ctext" rows="2" placeholder="いま思ったこと…" oninput="autoGrow(this);updSend()"></textarea>
  <div id="cprev"></div>
  <div class="gchips" id="cgenres"></div>
  <div class="crow">
    <button class="ibtn" onclick="document.getElementById('cphoto').click()" title="写真"><svg viewBox="0 0 48 48" fill="none" stroke="#8a776b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16 Q7 12 11 12 H16 L19 8 H29 L32 12 H37 Q41 12 41 16 V35 Q41 39 37 39 H11 Q7 39 7 35 Z"/><circle cx="24" cy="25" r="7"/></svg></button>
    <input type="file" id="cphoto" accept="image/*" style="display:none" onchange="pickPhoto(this,'new')">
    <button class="send" id="sendBtn" onclick="post()" disabled>つぶやく</button>
  </div>
</div>

<div class="tools">
  <div class="search"><svg viewBox="0 0 48 48" fill="none" stroke="#a89c90" stroke-width="3.5" stroke-linecap="round"><circle cx="21" cy="21" r="12"/><path d="M30 30 L40 40"/></svg><input type="search" id="q" placeholder="さがす" oninput="render()"><button id="qx" style="display:none" onclick="document.getElementById('q').value='';render()">×</button></div>
  <button class="tbtn" id="hideDoneBtn" onclick="toggleHideDone()">完了をかくす</button>
</div>
<div class="filter"><div class="gchips" id="fgenres"></div></div>

<div id="list"></div>

<div class="bkx">
  <h3><svg viewBox="0 0 48 48" fill="none" stroke="#6b5d52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 7 V25 M17 19 L24 26 L31 19"/><path d="M8 29 V35 Q8 40 13 40 H35 Q40 40 40 35 V29"/></svg> データのバックアップ</h3>
  メモはこの端末のブラウザ内に保存されています。ときどきファイルに書き出しておくと、機種変更やお引っ越しでも安心です。<br>
  <button class="bkx-btn" id="bkxExp">書き出す</button><button class="bkx-btn sub" id="bkxImpBtn">読み込む</button>
  <input type="file" id="bkxImp" accept=".json" style="display:none">
</div>

<div class="sheet-bg" id="gsheet" onclick="if(event.target===this)closeGenres()">
  <div class="sheet">
    <h2>ジャンルと色</h2>
    <div id="glist"></div>
    <div id="gpal"></div>
    <button class="sbtn sub" onclick="addGenre()">＋ ジャンルを追加</button>
    <button class="sbtn main" onclick="closeGenres()">完了</button>
  </div>
</div>
<div class="sheet-bg" id="fsheet" onclick="if(event.target===this)closeFonts()">
  <div class="sheet">
    <h2>文字のかたち</h2>
    <div id="flist"></div>
    <button class="sbtn main" onclick="closeFonts()">完了</button>
  </div>
</div>
<div class="viewer" id="viewer" onclick="this.classList.remove('on')"><img id="vimg" alt=""></div>
<div id="toast"></div>
<input type="file" id="ephoto" accept="image/*" style="display:none" onchange="pickPhoto(this,'edit')">

<script>
var KEY="tsubuyaki_v1";
var PAL=[
  {bg:"#f1e1df",deep:"#c0908a"},{bg:"#e5ebdf",deep:"#8fa384"},{bg:"#dfe7ee",deep:"#7f9bb2"},
  {bg:"#f1eadb",deep:"#b9a272"},{bg:"#e8e1ec",deep:"#9b89aa"},{bg:"#f0e3d9",deep:"#bb8d6f"},
  {bg:"#dfece8",deep:"#7ea79c"},{bg:"#ece6df",deep:"#a08f7e"},{bg:"#f2e0e6",deep:"#bd8a9c"},
  {bg:"#e4e4ea",deep:"#8b8c9e"},{bg:"#efeedd",deep:"#a4a26e"},{bg:"#e9dfd9",deep:"#9e8072"}
];
var state={memos:[], genres:[], hideDone:false};
var curG="", filterG="all", newPhoto="", editId=null, editPhoto=null, palFor=null;

function load(){
  try{ var v=localStorage.getItem(KEY); if(v){ var s=JSON.parse(v); for(var k in s) state[k]=s[k]; } }catch(e){}
  if(!Array.isArray(state.memos)) state.memos=[];
  if(!Array.isArray(state.genres)||!state.genres.length){
    state.genres=[{id:"g1",name:"思いつき",c:0},{id:"g2",name:"やること",c:3},{id:"g3",name:"買い物",c:1},{id:"g4",name:"子ども",c:2},{id:"g5",name:"家のこと",c:4}];
  }
  curG=state.genres[0].id;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); return true; }catch(e){ toast("保存できませんでした（容量がいっぱいかも）"); return false; } }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return (""+(s==null?"":s)).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
var toastT; function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove("show");},2200); }
function gById(id){ for(var i=0;i<state.genres.length;i++){ if(state.genres[i].id===id) return state.genres[i]; } return null; }
function colOf(id){ var g=gById(id); return g?PAL[g.c%PAL.length]:{bg:"#ece8e3",deep:"#a89c90"}; }
function autoGrow(el){ el.style.height="auto"; el.style.height=Math.min(el.scrollHeight,260)+"px"; }
function updSend(){ var t=document.getElementById("ctext").value.trim(); document.getElementById("sendBtn").disabled=!(t||newPhoto); }
function pad2(n){ return String(n).padStart(2,"0"); }
var WD=["日","月","火","水","木","金","土"];
function dayKey(ts){ var d=new Date(ts); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function dayLabel(ts){
  var d=new Date(ts), now=new Date(), k=dayKey(ts);
  if(k===dayKey(now.getTime())) return "今日";
  var y=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);
  if(k===dayKey(y.getTime())) return "昨日";
  return (d.getFullYear()!==now.getFullYear()?d.getFullYear()+"年":"")+(d.getMonth()+1)+"月"+d.getDate()+"日（"+WD[d.getDay()]+"）";
}
function hm(ts){ var d=new Date(ts); return d.getHours()+":"+pad2(d.getMinutes()); }

/* ===== アイコン ===== */
function ic(name, col){
  var s='<svg viewBox="0 0 48 48" fill="none" stroke="'+col+'" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">';
  if(name==="pin") s+='<path d="M19 8 H29 L27 20 Q34 23 34 29 H14 Q14 23 21 20 Z"/><path d="M24 29 V41"/>';
  if(name==="pinon") s+='<path d="M19 8 H29 L27 20 Q34 23 34 29 H14 Q14 23 21 20 Z" fill="'+col+'"/><path d="M24 29 V41"/>';
  if(name==="edit") s+='<path d="M10 38 L12 30 L31 11 Q34 8 37 11 Q40 14 37 17 L18 36 Z"/><path d="M28 14 L34 20"/>';
  if(name==="trash") s+='<path d="M9 13 H39"/><path d="M19 13 V9 H29 V13"/><path d="M12 13 L14 39 Q14 41 16 41 H32 Q34 41 34 39 L36 13"/><path d="M21 20 V34 M27 20 V34"/>';
  if(name==="box") s+='<rect x="9" y="9" width="30" height="30" rx="8" fill="rgba(255,255,255,.7)"/>';
  if(name==="check") s+='<rect x="9" y="9" width="30" height="30" rx="8" fill="'+col+'"/><path d="M16 24 L22 30 L33 17" stroke="#fff" stroke-width="4"/>';
  if(name==="camera") s+='<path d="M7 16 Q7 12 11 12 H16 L19 8 H29 L32 12 H37 Q41 12 41 16 V35 Q41 39 37 39 H11 Q7 39 7 35 Z"/><circle cx="24" cy="25" r="7"/>';
  return s+'</svg>';
}

/* ===== 入力欄 ===== */
function renderCompose(){
  var h=state.genres.map(function(g){ var c=PAL[g.c%PAL.length]; return '<button class="gchip'+(g.id===curG?' sel':'')+'" style="background:'+c.bg+';color:'+c.deep+'" onclick="setCurG(&#39;'+g.id+'&#39;)">'+esc(g.name)+'</button>'; }).join("")
    +'<button class="gchip add" onclick="openGenres()">✏️ 編集</button>';
  document.getElementById("cgenres").innerHTML=h;
  var c=colOf(curG); document.getElementById("compose").style.setProperty("--cbd", c.deep);
  document.getElementById("cprev").innerHTML=newPhoto?'<div class="prev"><img src="'+newPhoto+'" alt=""><button onclick="newPhoto=&#39;&#39;;renderCompose();updSend()">×</button></div>':'';
}
function setCurG(id){ curG=id; renderCompose(); }
function post(){
  var t=document.getElementById("ctext").value.trim();
  if(!t && !newPhoto) return;
  state.memos.push({id:uid(), t:t, g:curG, ts:Date.now(), pin:false, done:false, photo:newPhoto||""});
  if(!save()){ state.memos.pop(); return; }
  var ta=document.getElementById("ctext"); ta.value=""; autoGrow(ta); newPhoto="";
  renderCompose(); updSend(); render(); toast("つぶやいたよ");
}

/* ===== 写真 ===== */
function pickPhoto(inp, mode){
  var f=inp.files&&inp.files[0]; inp.value=""; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      var mx=900, w=im.width, h=im.height, sc=Math.min(1, mx/Math.max(w,h));
      var c=document.createElement("canvas"); c.width=Math.round(w*sc); c.height=Math.round(h*sc);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      var url=c.toDataURL("image/jpeg",0.7);
      if(mode==="new"){ newPhoto=url; renderCompose(); updSend(); }
      else { editPhoto=url; render(); }
    };
    im.onerror=function(){ toast("この写真は読み込めませんでした"); };
    im.src=r.result;
  };
  r.readAsDataURL(f);
}
function viewPhoto(id){ var m=findM(id); if(!m||!m.photo) return; document.getElementById("vimg").src=m.photo; document.getElementById("viewer").classList.add("on"); }

/* ===== 一覧 ===== */
function findM(id){ for(var i=0;i<state.memos.length;i++){ if(state.memos[i].id===id) return state.memos[i]; } return null; }
function renderFilter(){
  var h='<button class="gchip'+(filterG==="all"?' sel':'')+'" style="background:#fff;color:#8a776b" onclick="setFilter(&#39;all&#39;)">すべて</button>'
    +state.genres.map(function(g){ var c=PAL[g.c%PAL.length]; var n=state.memos.filter(function(m){return m.g===g.id;}).length; return '<button class="gchip'+(filterG===g.id?' sel':'')+'" style="background:'+c.bg+';color:'+c.deep+'" onclick="setFilter(&#39;'+g.id+'&#39;)">'+esc(g.name)+(n?' '+n:'')+'</button>'; }).join("");
  document.getElementById("fgenres").innerHTML=h;
  var b=document.getElementById("hideDoneBtn"); b.classList.toggle("on", !!state.hideDone);
}
function setFilter(g){ filterG=g; render(); }
function toggleHideDone(){ state.hideDone=!state.hideDone; save(); render(); }
function memoHtml(m){
  var c=colOf(m.g), g=gById(m.g);
  var st='background:'+c.bg+';--deep:'+c.deep;
  if(editId===m.id){
    var ph=editPhoto===null?m.photo:editPhoto;
    var gh=state.genres.map(function(x){ var cc=PAL[x.c%PAL.length]; return '<button class="gchip'+(x.id===(window.__eg||m.g)?' sel':'')+'" style="background:'+cc.bg+';color:'+cc.deep+'" onclick="window.__eg=&#39;'+x.id+'&#39;;render()">'+esc(x.name)+'</button>'; }).join("");
    return '<div class="memo" style="'+st+'"><textarea id="etext">'+esc(m.t)+'</textarea>'
      +(ph?'<div class="prev"><img src="'+ph+'" alt=""><button onclick="editPhoto=&#39;&#39;;render()">×</button></div>':'')
      +'<div class="gchips">'+gh+'</div>'
      +'<div class="ebtns"><button class="ng ibtn" style="margin-right:auto;background:none" onclick="document.getElementById(&#39;ephoto&#39;).click()">'+ic("camera",c.deep)+'</button><button class="ng" onclick="cancelEdit()">やめる</button><button class="ok" onclick="saveEdit()">保存</button></div></div>';
  }
  return '<div class="memo'+(m.done?' done':'')+(m.pin?' pin':'')+'" style="'+st+'">'
    +'<button class="ibtn chk" onclick="toggleDone(&#39;'+m.id+'&#39;)">'+ic(m.done?"check":"box",c.deep)+'</button>'
    +(m.t?'<div class="txt">'+esc(m.t)+'</div>':'')
    +(m.photo?'<img src="'+m.photo+'" alt="" onclick="viewPhoto(&#39;'+m.id+'&#39;)">':'')
    +'<div class="meta"><span class="gl">'+esc(g?g.name:"なし")+'</span><span>'+hm(m.ts)+'</span>'
    +'<span class="acts"><button class="ibtn" onclick="togglePin(&#39;'+m.id+'&#39;)">'+ic(m.pin?"pinon":"pin",c.deep)+'</button>'
    +'<button class="ibtn" onclick="startEdit(&#39;'+m.id+'&#39;)">'+ic("edit",c.deep)+'</button>'
    +'<button class="ibtn" onclick="delMemo(&#39;'+m.id+'&#39;)">'+ic("trash",c.deep)+'</button></span></div></div>';
}
function render(){
  renderFilter();
  var q=document.getElementById("q").value.trim().toLowerCase();
  document.getElementById("qx").style.display=q?"":"none";
  var arr=state.memos.filter(function(m){
    if(filterG!=="all" && m.g!==filterG) return false;
    if(state.hideDone && m.done && m.id!==editId) return false;
    if(q && (m.t||"").toLowerCase().indexOf(q)<0) return false;
    return true;
  }).sort(function(a,b){ return b.ts-a.ts; });
  var list=document.getElementById("list");
  if(!arr.length){
    list.innerHTML='<div class="empty">'+(state.memos.length?(q?"見つからなかったよ":"このジャンルのメモはまだないよ"):"まだメモがないよ。<br>上の入力欄から 思いついたことを書いてね")+'</div>';
    return;
  }
  var pins=arr.filter(function(m){return m.pin;}), rest=arr.filter(function(m){return !m.pin;});
  var h='';
  if(pins.length){ h+='<div class="sec">ピン留め</div>'+pins.map(memoHtml).join(""); }
  var last="";
  rest.forEach(function(m){ var k=dayKey(m.ts); if(k!==last){ h+='<div class="sec">'+dayLabel(m.ts)+'</div>'; last=k; } h+=memoHtml(m); });
  list.innerHTML=h;
  var et=document.getElementById("etext"); if(et){ autoGrow(et); }
}
function toggleDone(id){ var m=findM(id); if(!m) return; m.done=!m.done; save(); render(); if(m.done) toast("完了！"); }
function togglePin(id){ var m=findM(id); if(!m) return; m.pin=!m.pin; save(); render(); toast(m.pin?"ピン留めしたよ":"ピンをはずしたよ"); }
function delMemo(id){ var m=findM(id); if(!m) return; if(!confirm("このメモを消す？")) return; state.memos=state.memos.filter(function(x){return x.id!==id;}); save(); render(); }
function startEdit(id){ editId=id; editPhoto=null; window.__eg=null; render(); var et=document.getElementById("etext"); if(et){ et.focus(); } }
function cancelEdit(){ editId=null; editPhoto=null; window.__eg=null; render(); }
function saveEdit(){
  var m=findM(editId); if(!m) return cancelEdit();
  var t=document.getElementById("etext").value.trim();
  var ph=editPhoto===null?m.photo:editPhoto;
  if(!t && !ph){ toast("中身が空っぽだよ"); return; }
  var old={t:m.t,g:m.g,photo:m.photo};
  m.t=t; m.photo=ph; if(window.__eg) m.g=window.__eg;
  if(!save()){ m.t=old.t; m.g=old.g; m.photo=old.photo; return; }
  cancelEdit(); toast("保存したよ");
}

/* ===== ジャンル編集 ===== */
function openGenres(){ palFor=null; renderGenres(); document.getElementById("gsheet").classList.add("on"); }
function closeGenres(){
  state.genres.forEach(function(g){ var el=document.getElementById("gn_"+g.id); if(el){ var v=el.value.trim(); if(v) g.name=v; } });
  save(); document.getElementById("gsheet").classList.remove("on"); renderCompose(); render();
}
function renderGenres(){
  document.getElementById("glist").innerHTML=state.genres.map(function(g){ var c=PAL[g.c%PAL.length];
    return '<div class="grow"><span class="sw" style="background:'+c.deep+'" onclick="palFor=&#39;'+g.id+'&#39;;keepNames();renderGenres()"></span><input id="gn_'+g.id+'" value="'+esc(g.name)+'" maxlength="10"><button class="del" onclick="delGenre(&#39;'+g.id+'&#39;)">×</button></div>'
      +(palFor===g.id?'<div class="pal">'+PAL.map(function(p,i){ return '<span class="'+(i===g.c?'sel':'')+'" style="background:linear-gradient(135deg,'+p.bg+' 50%,'+p.deep+' 50%)" onclick="setGCol(&#39;'+g.id+'&#39;,'+i+')"></span>'; }).join("")+'</div>':'');
  }).join("")+'<div style="font-size:12px;color:var(--sub);margin:2px 4px 6px">丸い色を押すと色を変えられるよ</div>';
}
function keepNames(){ state.genres.forEach(function(g){ var el=document.getElementById("gn_"+g.id); if(el){ var v=el.value.trim(); if(v) g.name=v; } }); }
function setGCol(id,i){ keepNames(); var g=gById(id); if(g) g.c=i; palFor=null; save(); renderGenres(); renderCompose(); render(); }
function addGenre(){
  keepNames();
  var used=state.genres.map(function(g){return g.c;}), c=0; for(var i=0;i<PAL.length;i++){ if(used.indexOf(i)<0){ c=i; break; } }
  var g={id:"g"+uid(), name:"新しいジャンル", c:c}; state.genres.push(g); palFor=null; save(); renderGenres();
  var el=document.getElementById("gn_"+g.id); if(el){ el.focus(); el.select(); }
}
function delGenre(id){
  keepNames();
  if(state.genres.length<=1){ toast("ジャンルは1つは必要だよ"); return; }
  var g=gById(id), n=state.memos.filter(function(m){return m.g===id;}).length;
  if(!confirm("「"+g.name+"」を消す？"+(n?"（このジャンルのメモ"+n+"件は「なし」になるよ）":""))) return;
  state.genres=state.genres.filter(function(x){return x.id!==id;});
  if(curG===id) curG=state.genres[0].id; if(filterG===id) filterG="all";
  save(); renderGenres(); renderCompose(); render();
}

/* ===== フォント ===== */
var FONTS=[
  {id:"azuki", name:"あずき", css:"Azuki", note:"いつものフォント"},
  {id:"uzura", name:"うずら", css:"Uzura", note:"子どもアプリのフォント"},
  {id:"zenmaru", name:"Zen丸ゴシック", css:"Zen Maru Gothic", g:"Zen+Maru+Gothic:wght@500", note:"まるくてすっきり"},
  {id:"kiwi", name:"キウイ丸", css:"Kiwi Maru", g:"Kiwi+Maru:wght@400", note:"やわらかい明朝風"},
  {id:"klee", name:"クレー", css:"Klee One", g:"Klee+One:wght@600", note:"えんぴつで書いたような字"},
  {id:"yomogi", name:"よもぎ", css:"Yomogi", g:"Yomogi", note:"手書きのゆるい字"},
  {id:"system", name:"ふつう", css:"Hiragino Maru Gothic ProN", note:"スマホの文字"}
];
var SAMPLE="思いついたらすぐメモ";
function fontById(id){ for(var i=0;i<FONTS.length;i++){ if(FONTS[i].id===id) return FONTS[i]; } return FONTS[0]; }
function loadGFont(f, textOnly){
  if(!f.g) return;
  var id="gf_"+f.id+(textOnly?"_s":""); if(document.getElementById(id)) return;
  var l=document.createElement("link"); l.id=id; l.rel="stylesheet";
  l.href="https://fonts.googleapis.com/css2?family="+f.g+"&display=swap"+(textOnly?"&text="+encodeURIComponent(f.name+SAMPLE):"");
  document.head.appendChild(l);
}
function applyFont(){
  var f=fontById(state.font||"azuki"); loadGFont(f,false);
  document.body.style.setProperty("--font", '"'+f.css+'"');
}
function openFonts(){
  FONTS.forEach(function(f){ loadGFont(f,true); });
  renderFonts(); document.getElementById("fsheet").classList.add("on");
}
function closeFonts(){ document.getElementById("fsheet").classList.remove("on"); }
function renderFonts(){
  var cur=state.font||"azuki";
  document.getElementById("flist").innerHTML=FONTS.map(function(f){
    return '<button class="fopt'+(f.id===cur?' sel':'')+'" style="font-family:&#39;'+f.css+'&#39;,sans-serif" onclick="setFont(&#39;'+f.id+'&#39;)"><span class="fn">'+SAMPLE+'</span><span class="fl">'+f.name+'<br>'+f.note+'</span></button>';
  }).join("");
}
function setFont(id){ state.font=id; save(); applyFont(); renderFonts(); toast("「"+fontById(id).name+"」にしたよ"); }

load(); applyFont(); renderCompose(); render();
</script>

<script>
(function(){
  var APP="tsubuyaki";
  document.getElementById("bkxExp").addEventListener("click",function(){
    var data={};
    for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); data[k]=localStorage.getItem(k); }
    var blob=new Blob([JSON.stringify({__bkx:APP,data:data},null,2)],{type:"application/json"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    var d=new Date();
    a.download=APP+"-backup-"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+".json";
    a.click(); URL.revokeObjectURL(a.href);
  });
  document.getElementById("bkxImpBtn").addEventListener("click",function(){ document.getElementById("bkxImp").click(); });
  document.getElementById("bkxImp").addEventListener("change",function(ev){
    var f=ev.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var j=JSON.parse(r.result);
        var data=j.__bkx?j.data:j;
        if(typeof data!=="object"||!data) throw 0;
        if(!confirm("今の記録を読み込んだ内容で置き換えます。よろしいですか？")) return;
        Object.keys(data).forEach(function(k){ localStorage.setItem(k,data[k]); });
        alert("読み込みました。画面を更新します。"); location.reload();
      }catch(e){ alert("このファイルは読み込めませんでした"); }
    };
    r.readAsText(f); ev.target.value="";
  });
})();
</script>
