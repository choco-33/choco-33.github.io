<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="通帳">
<meta name="theme-color" content="#eef3f7">
<title>SakuとAoの通帳</title>
<style>
@font-face{font-family:"Uzura";src:url("../uzura.ttf") format("truetype");font-display:swap;}

  :root{
    --cream:#eef3f7;--paper:#ffffff;--ink:#4d5560;--ink-soft:#98a1ad;
    --saku:#6f9ec0;--saku-deep:#4f83a8;--ao:#7bb89a;--ao-deep:#5a9c7c;
    --in:#6faf7f;--in-deep:#4f9264;--out:#e0917d;--out-deep:#cc7159;
    --gold:#e6bd6a;--gold-deep:#c99a3e;--pink:#ec9fb0;--pink-deep:#cf7189;
    --line:#e2e9ef;--shadow:rgba(90,120,150,.15);
    --accent:#6f9ec0;--accent-deep:#4f83a8;
  }
  body.ao{--accent:#7bb89a;--accent-deep:#5a9c7c;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Uzura","Hiragino Maru Gothic ProN",sans-serif;
    background:radial-gradient(circle at 14% 6%,rgba(111,158,192,.14),transparent 44%),
      radial-gradient(circle at 86% 94%,rgba(123,184,154,.14),transparent 44%),var(--cream);
    color:var(--ink);min-height:100vh;padding:15px 12px 96px;display:flex;justify-content:center;}
  .app{width:100%;max-width:460px;}
  .head{text-align:center;margin:2px 0 10px;}
  .head .deco{font-size:13px;color:var(--accent-deep);letter-spacing:.08em;}
  .head h1{font-size:22px;letter-spacing:.03em;margin-top:2px;color:var(--accent-deep);}

  .tabs{display:flex;gap:8px;margin:12px 0 14px;}
  .tabk{flex:1;text-align:center;font-family:inherit;font-size:17px;color:var(--ink-soft);
    background:var(--paper);border:2px solid var(--line);padding:12px 0;border-radius:16px;cursor:pointer;box-shadow:0 2px 8px var(--shadow);}
  .tabk.on[data-k="saku"]{background:var(--saku);border-color:var(--saku);color:#fff;}
  .tabk.on[data-k="ao"]{background:var(--ao);border-color:var(--ao);color:#fff;}

  .bal{background:linear-gradient(160deg,#fff,#f3f8fb);border:1px solid var(--line);border-radius:22px;
    padding:18px 16px 14px;text-align:center;box-shadow:0 6px 18px var(--shadow);margin-bottom:14px;}
  .bal .lbl{font-size:13px;color:var(--ink-soft);}
  .bal .amt{font-size:38px;color:var(--accent-deep);line-height:1.2;}
  .bal .amt small{font-size:18px;}
  .wallets{display:flex;gap:6px;margin-top:10px;}
  .wl{flex:1;border-radius:13px;padding:7px 4px;font-size:11px;line-height:1.4}
  .wl b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
  .wl.use{background:#e9f1f8;color:var(--accent-deep)} body.ao .wl.use{background:#e6f3ec}
  .wl.bank{background:#fbf1dc;color:var(--gold-deep)}
  .wl.give{background:#fbe8ee;color:var(--pink-deep)}
  .wl.etc{background:#f1f3f6;color:#7a8492}
  .bal .sub{font-size:11px;color:var(--ink-soft);margin-top:7px}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:15px 14px;
    box-shadow:0 5px 16px var(--shadow);margin-bottom:14px;}
  .card h3{font-size:15px;color:var(--accent-deep);margin-bottom:8px}
  .seg{display:flex;gap:6px;margin-bottom:12px;}
  .seg button{flex:1;font-family:inherit;font-size:14px;border:2px solid var(--line);background:var(--cream);
    color:var(--ink-soft);border-radius:13px;padding:10px 0;cursor:pointer;}
  .seg button.on.in{background:var(--in);border-color:var(--in);color:#fff;}
  .seg button.on.out{background:var(--out);border-color:var(--out);color:#fff;}
  .seg button.on.move{background:var(--gold);border-color:var(--gold);color:#fff;}
  .f-label{font-size:12px;font-weight:700;color:var(--ink-soft);margin:11px 2px 6px;}
  input[type=date],input[type=text],input[type=number],select{width:100%;font-family:inherit;font-size:15px;color:var(--ink);
    background:var(--cream);border:1.5px solid var(--line);border-radius:13px;padding:10px 12px;outline:none;-webkit-appearance:none;}
  input:focus,select:focus{border-color:var(--accent);}
  .yen-row{position:relative;}
  .yen-row::after{content:"円";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:700;color:var(--ink-soft);}
  .yen-row input{font-size:20px;padding:12px 42px 12px 14px;font-variant-numeric:tabular-nums;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{font-family:inherit;font-size:12.5px;color:var(--ink-soft);background:var(--cream);
    border:1.5px solid var(--line);border-radius:99px;padding:8px 12px;cursor:pointer;}
  .chip.sel{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff;}
  .chip.w-use.sel{background:var(--accent-deep);border-color:var(--accent-deep)}
  .chip.w-bank.sel{background:var(--gold-deep);border-color:var(--gold-deep)}
  .chip.w-give.sel{background:var(--pink-deep);border-color:var(--pink-deep)}
  .chip.w-split.sel{background:#7a8492;border-color:#7a8492}
  .chip.add{border-style:dashed;}
  .chip.editing{border-color:#e0a9a4;color:#c4756f;}
  .hint{font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.6}
  .save-btn{display:block;width:100%;margin-top:14px;font-family:inherit;font-size:17px;color:#fff;
    background:var(--accent-deep);border:none;border-radius:15px;padding:13px;cursor:pointer;}
  .sub-btn{display:block;width:100%;margin-top:8px;font-family:inherit;font-size:13px;color:var(--ink-soft);
    background:transparent;border:none;cursor:pointer;padding:8px;}
  .mini-btn{font-family:inherit;font-size:12.5px;border:none;border-radius:11px;padding:8px 12px;cursor:pointer;background:var(--accent-deep);color:#fff}
  .mini-btn.ghost{background:var(--cream);color:var(--ink-soft);border:1.5px solid var(--line)}

  .sec-title{font-size:13px;color:var(--ink-soft);margin:4px 4px 8px;}
  .listmode{display:flex;gap:6px;margin:4px 0 10px}
  .listmode .lm{flex:1;padding:8px 0;border:2px solid var(--accent-deep);border-radius:12px;background:#fff;font-family:inherit;font-size:13px;color:var(--accent-deep);cursor:pointer}
  .listmode .lm.on{background:var(--accent-deep);color:#fff}
  .row{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);
    border-radius:14px;padding:11px 13px;box-shadow:0 3px 9px var(--shadow);margin-bottom:8px;}
  .row .r-date{flex:0 0 auto;font-size:11px;color:var(--ink-soft);width:38px;text-align:center;line-height:1.3;}
  .row .r-mid{flex:1;min-width:0;cursor:pointer;}
  .row .r-cat{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .r-memo{font-size:11px;color:var(--ink-soft);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .r-amt{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .otochk{display:block;margin:10px 0 4px;padding:10px 12px;border:2px solid #e8a7a7;border-radius:14px;background:#fff4f2;font-size:14px;cursor:pointer}
  .otochk input{width:18px;height:18px;vertical-align:-3px;margin-right:4px}
  .otochk span{font-size:12px;color:var(--ink-soft);margin-left:26px}
  .chores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .chores button{padding:12px 6px;border:2px solid var(--line);border-radius:14px;background:#fff;font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer;line-height:1.3}
  .chores button b{display:block;font-size:13px;color:var(--in-deep)}
  .chores button:active{transform:scale(.96)}
  .oto{background:#fff4f2;border:2px solid #f0c4c0;border-radius:16px;padding:12px;margin-top:10px}
  .oto .t{display:flex;justify-content:space-between;font-size:15px}
  .oto .big{font-size:22px;font-weight:700;color:#c0605a;text-align:center;margin:6px 0}
  .oto .bar{height:10px;background:#f6dcd8;border-radius:6px;overflow:hidden;margin:6px 0}
  .oto .bar span{display:block;height:100%;background:#e58a82}
  .oto .acts{text-align:right}
  .oto .acts button{border:none;background:none;color:var(--ink-soft);font-family:inherit;font-size:12px;text-decoration:underline;cursor:pointer}
  .chedit{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-family:inherit;font-size:12px;color:var(--ink-soft);cursor:pointer}
  .splitbox{background:#fafbfd;border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
  .sprow{display:flex;align-items:center;gap:8px;margin:5px 0}
  .sprow .wtag{flex:0 0 64px;text-align:center;font-size:13px;padding:5px 0}
  .sprow input{flex:1;min-width:0;text-align:right}
  .unpaid{background:#f4f9f5;border:2px solid #cfe6d6;border-radius:16px;padding:10px 12px;margin-top:10px;text-align:center}
  .unpaid .ut{font-size:13px;color:var(--ink-soft)}
  .unpaid .ua{font-size:26px;font-weight:700;color:var(--in-deep)}
  .unpaid .ul{max-height:150px;overflow-y:auto;text-align:left;margin:4px 0}
  .unpaid .ui{display:flex;justify-content:space-between;font-size:13px;padding:3px 2px;border-bottom:1px dotted var(--line)}
  .unpaid .ui button{border:none;background:none;color:#c99;font-size:13px;cursor:pointer;padding:0 2px}
  .paybtn{margin-top:8px;width:100%;padding:11px;border:none;border-radius:14px;background:var(--in-deep);color:#fff;font-family:inherit;font-size:16px;cursor:pointer}
  .allow{background:#fdf6e6;border:2px solid #f0dca8;border-radius:16px;padding:10px 12px;margin-top:8px;text-align:center;font-size:15px}
  .allow b{font-size:20px;color:var(--gold-deep)}
  .allow .warn{font-size:13px;color:var(--out-deep);margin-top:2px}
  .allow.done{background:#f4f9f5;border-color:#cfe6d6;color:var(--in-deep)}
  .allow.done span{font-size:12px;color:var(--ink-soft)}
  .crow{display:flex;gap:6px;align-items:center;margin-top:6px}
  .crow input{flex:1;min-width:0}
  .crow input.n{flex:0 0 70px}
  .crow button{flex:0 0 auto;border:none;background:#f3e6e6;color:#a05a5a;border-radius:10px;padding:6px 10px;font-family:inherit;cursor:pointer}
  .cattabs{display:flex;gap:6px;margin:2px 0 8px;overflow-x:auto}
  .cattabs button{flex:1 0 auto;padding:8px 12px;border:2px solid var(--line);border-radius:999px;background:#fff;font-family:inherit;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}
  .cattabs button.on{background:var(--gold);border-color:var(--gold-deep);color:#5a4a20;font-weight:700}
  .catsum{background:var(--paper);border:2px dashed var(--gold-deep);border-radius:14px;padding:10px 14px;margin:0 0 10px;text-align:center;font-size:14px}
  .catsum b{font-size:20px;color:var(--in-deep)}
  .noBal .r-bal{display:none}
  .noBal .ptable th:last-child,.noBal .ptable td:last-child{display:none}
  .row.auto{background:#fbf7ea;border-style:dashed}
  .row .r-amt.in{color:var(--in-deep);} .row .r-amt.out{color:var(--out-deep);} .row .r-amt.move{color:var(--gold-deep)}
  .row .r-bal{font-size:10.5px;color:var(--ink-soft);text-align:right;min-width:58px;font-variant-numeric:tabular-nums;}
  .row .del{flex:0 0 auto;width:24px;height:24px;border:none;background:transparent;color:var(--ink-soft);font-size:16px;cursor:pointer;opacity:.4;}
  .wtag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:99px;margin-left:4px;vertical-align:middle}
  .wtag.use{background:#e9f1f8;color:var(--accent-deep)} body.ao .wtag.use{background:#e6f3ec}
  .wtag.bank{background:#fbf1dc;color:var(--gold-deep)}
  .wtag.give{background:#fbe8ee;color:var(--pink-deep)}
  .wtag.fixed,.wtag.stock{background:#f1f3f6;color:#7a8492}
  .edit-hint{color:var(--accent-deep);}
  .empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:22px 10px;line-height:1.9;}
  .ptable{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .ptable th,.ptable td{padding:8px 6px;border-bottom:1px dashed #e6dcc6;text-align:right}
  .ptable th{background:#f6efdd;color:#8a7a53;font-weight:700;text-align:center;font-size:11px}
  .ptable td.dt{text-align:center;white-space:nowrap;color:#8a7a53}
  .ptable td.ct{text-align:left;color:#4d5560;line-height:1.35}
  .ptable td.inc{color:#2f8a5b;font-weight:700;white-space:nowrap}
  .ptable td.exp{color:#c0453b;font-weight:700;white-space:nowrap}
  .ptable td.bal{font-weight:700;color:#4d5560;white-space:nowrap}
  .ptable tr:last-child td{border-bottom:none}

  /* 銀行 */
  .bank-top{background:linear-gradient(160deg,#fffaf0,#fbf0d8);border:1px solid #f0e1bd;border-radius:22px;padding:18px 16px;text-align:center;box-shadow:0 6px 18px rgba(201,154,62,.18);margin-bottom:14px}
  .bank-top .lbl{font-size:13px;color:var(--gold-deep)}
  .bank-top .amt{font-size:36px;color:var(--gold-deep);line-height:1.25}
  .bank-top .amt small{font-size:17px}
  .bank-top .rate{display:inline-block;margin-top:4px;background:#fff;border-radius:99px;padding:3px 12px;font-size:12px;color:var(--gold-deep)}
  .bank-info{font-size:12.5px;color:var(--ink);line-height:1.8;margin-top:10px}
  .bank-info b{color:var(--gold-deep)}
  .irow{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .irow:last-child{border-bottom:none}
  .irow .v{color:var(--gold-deep);font-weight:700}
  .fx{border:1.5px solid #f0e1bd;border-radius:14px;padding:10px 12px;margin-bottom:8px;background:#fffdf7}
  .fx .t{display:flex;justify-content:space-between;font-size:14px}
  .fx .t b{color:var(--gold-deep)}
  .fx .s{font-size:11.5px;color:var(--ink-soft);margin-top:3px}
  .bar{height:9px;border-radius:99px;background:#f1e8d4;overflow:hidden;margin-top:7px}
  .bar span{display:block;height:100%;border-radius:99px;background:var(--gold)}
  .bar.gbar span{background:var(--accent)}
  .fx .acts{display:flex;justify-content:flex-end;margin-top:6px}
  .fx .acts button{border:none;background:none;font-family:inherit;font-size:11.5px;color:#c4756f;cursor:pointer}
  .frow{display:flex;gap:6px;margin-top:6px}
  .frow>*{flex:1}
  .sim{display:flex;align-items:flex-end;gap:10px;height:150px;margin:14px 2px 6px;padding-top:10px}
  .sim .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .sim .bars{display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center;flex:1}
  .sim .b1{width:40%;background:#d8dee6;border-radius:6px 6px 0 0}
  .sim .b2{width:40%;background:var(--gold);border-radius:6px 6px 0 0}
  .sim .yl{font-size:11.5px;color:var(--ink-soft);margin-top:4px}
  .sim .vl{font-size:10.5px;color:var(--gold-deep);font-weight:700;white-space:nowrap}
  .legend{font-size:11px;color:var(--ink-soft);display:flex;gap:12px;justify-content:center}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
  .set-row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}
  .set-row label{flex:1}
  .set-row input{width:90px;flex:0 0 90px;padding:8px 10px;font-size:14px;text-align:right}
  details summary{cursor:pointer;font-size:13px;color:var(--ink-soft);list-style:none}
  details summary::-webkit-details-marker{display:none}
  .pig{display:flex;flex-direction:column;align-items:center;margin-bottom:4px}
  .pig svg{display:block;transition:width .4s,height .4s}
  .pig .lv{font-size:13px;color:var(--gold-deep);margin-top:2px}
  .pig .nx{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
  .pig .bar{width:70%;margin:5px auto 0}
  .stamps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
  .stamp{border:1.5px dashed #e3d6b4;border-radius:12px;text-align:center;padding:5px 0 4px;font-size:10.5px;color:var(--ink-soft);background:#fffdf7}
  .stamp .m{font-size:20px;line-height:1.3;height:26px}
  .stamp.on{border-style:solid;border-color:var(--gold);background:#fff6df;color:var(--gold-deep)}
  .stamp.now{border-color:var(--accent)}
  .streak{font-size:14px;margin-top:4px}
  .streak b{color:var(--gold-deep);font-size:20px}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .badge{border-radius:12px;padding:6px 10px;font-size:12px;background:#f3f5f8;color:#a5adb8}
  .badge.on{background:#fff3d6;color:var(--gold-deep)}

  /* ほしい */
  .goal{border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px}
  .goal .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .goal .t .n{font-size:15px;flex:1;min-width:0}
  .goal .t .g{font-size:13px;color:var(--accent-deep);white-space:nowrap}
  .goal .s{font-size:12px;color:var(--ink);margin-top:5px;line-height:1.6}
  .goal .done{color:var(--in-deep);font-weight:700}
  .goal .acts{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}

  /* 株 */
  .co{border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:#fff}
  .co .t{display:flex;align-items:center;gap:8px}
  .co .em{font-size:26px}
  .co .nm{flex:1;min-width:0}
  .co .nm b{display:block;font-size:15px}
  .co .nm small{font-size:11px;color:var(--ink-soft)}
  .co .pr{text-align:right}
  .co .pr b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
  .co .up{color:#d0604f;font-size:11.5px} .co .dn{color:#4f86b0;font-size:11.5px} .co .fl{color:var(--ink-soft);font-size:11.5px}
  .co svg{display:block;width:100%;height:40px;margin-top:6px}
  .co .hold{font-size:12px;margin-top:6px;color:var(--ink)}
  .co .hold .p{color:#d0604f} .co .hold .m{color:#4f86b0}
  .co .trade{display:flex;gap:6px;align-items:center;margin-top:8px}
  .co .trade input{width:70px;flex:0 0 70px;padding:7px 8px;font-size:14px;text-align:center}
  .co .trade span{font-size:12px;color:var(--ink-soft)}
  .co .trade .buy{background:#d0604f} .co .trade .sell{background:#4f86b0}
  .note{font-size:11.5px;color:var(--ink-soft);line-height:1.7;margin:2px 4px 10px}

  .tabbar{position:fixed;bottom:0;left:0;right:0;max-width:460px;margin:0 auto;display:flex;background:var(--paper);
    box-shadow:0 -2px 10px var(--shadow);padding-bottom:env(safe-area-inset-bottom);z-index:20;border-radius:16px 16px 0 0}
  .tabbar button{flex:1;border:none;background:none;padding:10px 0 9px;font-family:inherit;font-size:12px;color:var(--ink-soft)}
  .tabbar button .ic{display:block;font-size:20px;line-height:1.2}
  .tabbar button.on{color:var(--accent-deep)}
  .page{display:none}
  .page.on{display:block}

  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(80px);background:var(--ink);
    color:#fff;font-size:14px;padding:12px 22px;border-radius:99px;box-shadow:0 6px 20px var(--shadow);
    z-index:80;opacity:0;transition:.35s cubic-bezier(.34,1.56,.64,1);max-width:90vw;text-align:center;}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
  .party{position:fixed;font-size:24px;pointer-events:none;z-index:70;animation:fall 1.6s ease-in forwards}
  @keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(160px) rotate(240deg)}}

  .bkx{margin:20px 2px 10px;background:var(--paper);border:1px solid var(--line);border-radius:18px;
    padding:14px 16px;box-shadow:0 4px 12px var(--shadow);font-size:12px;color:var(--ink-soft);line-height:1.7}
  .bkx h3{font-size:13.5px;color:var(--ink);margin-bottom:4px;}
  .bkx .bkx-btn{border:none;border-radius:12px;padding:9px 16px;font-family:inherit;font-size:12.5px;
    color:#fff;background:var(--saku);margin:8px 8px 0 0;cursor:pointer}
  .bkx .bkx-btn.sub{background:#c3ccd6}
</style>
</head>

<div class="toast" id="toast"></div>

<script>
var KEY="tsucho_v1";
var DEF_IN=["お小遣い","お年玉","お手伝い","プレゼント","その他"];
var DEF_CHORES=[["お皿洗い",10],["洗濯物たたみ",10],["お風呂掃除",20],["靴ならべ",5],["おつかい",20]];
var DEF_OUT=["お菓子・ジュース","おもちゃ","本","寄付","その他"];
var KNAME={saku:"Saku", ao:"Ao"};
var WNAME={use:"使う", bank:"預金", give:"あげる", fixed:"定期預金", stock:"株"};
var COS=[
  {id:"pan",  em:"🍞", name:"くまのパン屋",   desc:"毎日みんなが買うパン屋さん。値動きはおだやか", base:100, vol:0.018, drift:0.0006},
  {id:"toy",  em:"🧸", name:"おもちゃ工場",   desc:"クリスマス前は人気かも？",               base:150, vol:0.025, drift:0.0004},
  {id:"park", em:"🎡", name:"どうぶつ遊園地", desc:"お天気しだいでお客さんが変わる",           base:200, vol:0.032, drift:0.0005},
  {id:"rkt",  em:"🚀", name:"ロケット工業",   desc:"大きく上がることも下がることもある",       base:300, vol:0.05,  drift:0.0008}
];
var STOCK_START="2026-10-01";

var state={kids:{}, catsIn:null, catsOut:null, bank:null};
var curKid="saku", curPage="book", selType="in", selCatIn="", selCatOut="", editCats=false, editId=null;
var selW="use", moveFrom="use", moveTo="bank", listMode="card";

function newKid(){ return {entries:[], fixed:[], goals:[], stocks:{}, lastInterest:"", bonusCredit:0, lastStreakCheck:"", awards:[], best:0}; }
function load(){
  try{ var v=localStorage.getItem(KEY); if(v){ var s=JSON.parse(v); for(var k in s) state[k]=s[k]; } }catch(e){}
  if(!state.kids) state.kids={};
  ["saku","ao"].forEach(function(k){
    var kd=state.kids[k]; if(!kd) kd=state.kids[k]=newKid();
    if(!Array.isArray(kd.entries)) kd.entries=[];
    if(!Array.isArray(kd.fixed)) kd.fixed=[];
    if(!Array.isArray(kd.goals)) kd.goals=[];
    if(!kd.stocks || typeof kd.stocks!=="object") kd.stocks={};
    if(typeof kd.lastInterest!=="string") kd.lastInterest="";
    if(typeof kd.bonusCredit!=="number") kd.bonusCredit=0;
    if(typeof kd.lastStreakCheck!=="string") kd.lastStreakCheck="";
    if(!Array.isArray(kd.awards)) kd.awards=[];
    if(typeof kd.best!=="number") kd.best=0;
    if(!Array.isArray(kd.choreLog)) kd.choreLog=[];
  });
  if(!Array.isArray(state.catsIn)||!state.catsIn.length) state.catsIn=DEF_IN.slice();
  if(!Array.isArray(state.catsOut)||!state.catsOut.length) state.catsOut=DEF_OUT.slice();
  if(!state.bank) state.bank={};
  var b=state.bank;
  if(!b.kids) b.kids={};
  ["saku","ao"].forEach(function(k){
    var r=b.kids[k]; if(!r) r=b.kids[k]={};
    if(typeof r.rate!=="number") r.rate=(typeof b.rate==="number"?b.rate:5);
    if(!r.fixed) r.fixed=b.fixedRates?{"3":b.fixedRates["3"],"6":b.fixedRates["6"],"12":b.fixedRates["12"]}:{"3":6,"6":7,"12":8};
    if(!r.split) r.split=b.split?{use:b.split.use,bank:b.split.bank,give:b.split.give}:{use:50,bank:40,give:10};
    if(typeof r.bonus!=="number") r.bonus=10;
    if(typeof r.streakReward!=="number") r.streakReward=100;
    if(typeof r.otoshiRate!=="number") r.otoshiRate=10;
    if(typeof r.allowance!=="number") r.allowance=0;
  });
  b.stockOn=false;
  if(!state.choreMig1){
    ["saku","ao"].forEach(function(k){
      var kd=state.kids[k], keep=[];
      kd.entries.forEach(function(e){
        if(e.cat==="お手伝い" && e.type==="in" && !e.sys && !e.pay && !e.from && e.memo && (e.w||"use")==="use"){ kd.choreLog.push({id:uid(), date:e.date, name:e.memo, amt:e.amt, paid:false}); }
        else keep.push(e);
      });
      kd.entries=keep;
      kd.choreLog.sort(function(x,y){ return x.date<y.date?-1:(x.date>y.date?1:0); });
    });
    state.choreMig1=true;
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }
  if(!Array.isArray(state.chores)) state.chores=DEF_CHORES.map(function(c){return {name:c[0], amt:c[1]};});
  selCatIn=state.catsIn[0]||""; selCatOut=state.catsOut[0]||"";
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); return true; }catch(e){ toast("保存できませんでした"); return false; } }
function K(){ return state.kids[curKid]; }
function RK(k){ return state.bank.kids[k]; }
function R(){ return RK(curKid); }
var SYS_IN=["利息","定期預金の利息","預金ボーナス","続けたごほうび","お年玉定期の利息"];
function esc(s){ return (""+(s==null?"":s)).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function yen(n){ return Math.round(n||0).toLocaleString("ja-JP"); }
function pad2(n){ return String(n).padStart(2,"0"); }
function dstr(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function todayStr(){ return dstr(new Date()); }
function parseD(s){ var p=(""+s).split("-"); return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10)); }
function md(ds){ var p=(""+ds).split("-"); return p.length===3?(parseInt(p[1],10)+"/"+parseInt(p[2],10)):ds; }
function ymd(ds){ var p=(""+ds).split("-"); return p.length===3?(p[0]+"年"+parseInt(p[1],10)+"月"+parseInt(p[2],10)+"日"):ds; }
function addMonths(ds, n){ var d=parseD(ds); var day=d.getDate(); var t=new Date(d.getFullYear(), d.getMonth()+n, 1); var last=new Date(t.getFullYear(), t.getMonth()+1, 0).getDate(); t.setDate(Math.min(day,last)); return dstr(t); }
function daysBetween(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }
function uid(){ return Date.now()+"_"+Math.random().toString(36).slice(2,6); }
var toastT; function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove("show");},2400); }
function party(){ var ch=["🎉","✨","🪙","⭐","💰"]; for(var i=0;i<10;i++){ var s=document.createElement("span"); s.className="party"; s.textContent=ch[Math.floor(Math.random()*ch.length)]; s.style.left=(10+Math.random()*80)+"vw"; s.style.top=(20+Math.random()*30)+"vh"; document.body.appendChild(s); (function(el){ setTimeout(function(){el.remove();},1700); })(s); } }

/* ===== お金の計算 ===== */
function sums(k){
  var s={use:0,bank:0,give:0,fixed:0,stock:0};
  state.kids[k].entries.forEach(function(e){
    var w=e.w||"use";
    if(e.type==="in") s[w]+=e.amt; else if(e.type==="out") s[w]-=e.amt;
    else if(e.type==="move"){ s[w]-=e.amt; s[e.to]=(s[e.to]||0)+e.amt; }
  });
  return s;
}
function total(s){ return s.use+s.bank+s.give+s.fixed+s.stock; }
function addEntry(k, o){ o.id=o.id||uid(); state.kids[k].entries.push(o); return o; }

/* ===== 利息と定期の自動処理 ===== */
function ym(ds){ return (""+ds).slice(0,7); }
function prevYm(s){ var y=parseInt(s.slice(0,4),10), m=parseInt(s.slice(5,7),10)-1; if(m<1){m=12;y--;} return y+"-"+pad2(m); }
function monthNet(k, m){
  var n=0;
  state.kids[k].entries.forEach(function(e){
    if((""+e.date).slice(0,7)!==m || e.goal) return;
    var w=e.w||"use";
    if(e.type==="in" && w==="bank" && SYS_IN.indexOf(e.cat)<0) n+=e.amt;
    if(e.type==="out" && w==="bank") n-=e.amt;
    if(e.type==="move" && e.to==="bank" && (w==="use"||w==="give")) n+=e.amt;
    if(e.type==="move" && w==="bank" && (e.to==="use"||e.to==="give")) n-=e.amt;
  });
  return n;
}
function streakEnd(k, m){ var c=0, g=0; while(monthNet(k,m)>0 && g<240){ c++; g++; m=prevYm(m); } return c; }
function applyBonus(k, amt, date, grp){
  return 0;
  var kd=state.kids[k], pct=RK(k).bonus; if(!(pct>0)) return 0;
  var elig=Math.max(0, amt-kd.bonusCredit); kd.bonusCredit=Math.max(0, kd.bonusCredit-amt);
  var b=Math.floor(elig*pct/100);
  if(b>0) addEntry(k,{date:date, type:"in", w:"bank", cat:"預金ボーナス", memo:pct+"%", amt:b, sys:true, grp:grp});
  return b;
}
function nextYm(s){ var y=parseInt(s.slice(0,4),10), m=parseInt(s.slice(5,7),10)+1; if(m>12){m=1;y++;} return y+"-"+pad2(m); }
function processBank(k){
  var kd=state.kids[k], got=0, msgs=[];
  var cur=ym(todayStr());
  kd.lastInterest=cur; kd.lastStreakCheck=prevYm(cur);
  var guard=0;
  while(kd.lastInterest<cur && guard<240){
    guard++;
    var nm=nextYm(kd.lastInterest);
    var bal=sums(k).bank;
    var rr=RK(k).rate;
    var amt=Math.floor(Math.max(0,bal)*rr/1200);
    if(amt>0){ addEntry(k,{date:nm+"-01", type:"in", w:"bank", cat:"利息", memo:"年利"+rr+"%", amt:amt, sys:true}); got+=amt; }
    kd.lastInterest=nm;
  }
  if(got>0) msgs.push("預金に利息がついたよ！ ＋"+yen(got)+"円");
  var prev=prevYm(cur), g2=0;
  if(!kd.lastStreakCheck) kd.lastStreakCheck=prev;
  while(kd.lastStreakCheck<prev && g2<240){
    g2++;
    var mm=nextYm(kd.lastStreakCheck), st=streakEnd(k,mm);
    if(st>kd.best) kd.best=st;
    if(st>0 && st%3===0 && kd.awards.indexOf(mm)<0){
      kd.awards.push(mm);
      var rw=RK(k).streakReward;
      if(rw>0) addEntry(k,{date:nextYm(mm)+"-01", type:"in", w:"bank", cat:"続けたごほうび", memo:st+"か月つづけた", amt:rw, sys:true});
      msgs.push(st+"か月つづけたごほうび！"+(rw>0?" ＋"+yen(rw)+"円":""));
    }
    kd.lastStreakCheck=mm;
  }
  var t=todayStr();
  kd.fixed.forEach(function(f){
    if(f.status!=="active") return;
    var mat=addMonths(f.start, f.months);
    if(f.otoshi) mat=f.mat;
    if(t>=mat){
      if(f.otoshi){
        addEntry(k,{date:mat, type:"move", w:"fixed", to:"bank", cat:"お年玉定期 満期", memo:"", amt:f.amt, sys:true, fx:f.id});
        var it2=Math.floor(f.amt*f.rate/100);
        if(it2>0) addEntry(k,{date:mat, type:"in", w:"bank", cat:"お年玉定期の利息", memo:"年利"+f.rate+"%", amt:it2, sys:true, fx:f.id});
        f.status="done"; f.end=mat; f.interest=it2;
        msgs.push("🧧 お年玉定期が満期！ 利息 ＋"+yen(it2)+"円");
        return;
      }
      addEntry(k,{date:mat, type:"move", w:"fixed", to:"bank", cat:"定期預金 満期", memo:f.months+"か月", amt:f.amt, sys:true});
      var it=Math.floor(f.amt*f.rate/100*f.months/12);
      if(it>0) addEntry(k,{date:mat, type:"in", w:"bank", cat:"定期預金の利息", memo:"年利"+f.rate+"%", amt:it, sys:true});
      f.status="done"; f.end=mat; f.interest=it;
      msgs.push("定期預金が満期！ 利息 ＋"+yen(it)+"円");
    }
  });
  return msgs;
}
function runAuto(){
  var mine=[];
  ["saku","ao"].forEach(function(k){ var m=processBank(k); if(k===curKid) mine=m; });
  save();
  if(mine.length){ setTimeout(function(){ toast(mine.join(" / ")+" 🎉"); party(); }, 500); }
}

/* ===== 画面の切り替え ===== */
function setKid(k){ if(editId) endEdit(false); curKid=k; renderAll(); }
function showPage(p){
  curPage=p;
  ["book","bank","goal","stock"].forEach(function(x){
    document.getElementById("pg-"+x).classList.toggle("on", x===p);
    document.getElementById("tb-"+x).classList.toggle("on", x===p);
  });
  renderPage(); try{ window.scrollTo(0,0); }catch(e){}
}
var allowEdit=false;
function renderAllow(){
  var el=document.getElementById("allowCard"); if(!el) return;
  var a=R().allowance, cm=ym(todayStr()), mn=parseInt(cm.slice(5,7),10);
  var paid=K().entries.filter(function(e){return e.allow===cm || (!e.allow && !e.sys && e.type==="in" && e.cat==="お小遣い" && ym(e.date)===cm);})[0];
  var hd='<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">💴 お小遣い</h3>'+(a>0&&!allowEdit?'<button class="chedit" onclick="allowEdit=true;renderAllow()">✏️ 金額</button>':'')+'</div>';
  if(!(a>0) || allowEdit){
    el.innerHTML=hd+'<div class="hint" style="margin-top:2px">'+KNAME[curKid]+'の 毎月のお小遣いはいくら？</div>'
      +'<div class="crow"><input class="n" style="flex:1" type="number" id="alA" min="1" inputmode="numeric" placeholder="500" value="'+(a||"")+'"><span style="font-size:13px">円</span><button style="background:var(--accent-deep);color:#fff" onclick="setAllow()">決める</button></div>';
    return;
  }
  if(paid){
    el.innerHTML=hd+'<div class="allow done">✓ '+mn+'月のお小遣い '+yen(paid.amt)+'円<br><span>'+md(paid.date)+'に 渡したよ</span></div>';
  }else{
    el.innerHTML=hd+'<div class="allow"><div>'+mn+'月のお小遣い <b>'+yen(a)+'円</b></div><div class="warn">まだ渡してないよ</div>'
      +'<button class="paybtn" onclick="payAllow()">💴 '+yen(a)+'円 渡した</button></div>';
  }
}
function setAllow(){
  var v=parseInt(document.getElementById("alA").value,10)||0; if(v<1){ toast("金額を入れてね"); return; }
  R().allowance=v; allowEdit=false; save(); renderAllow(); toast(KNAME[curKid]+"のお小遣いを 月"+yen(v)+"円にしたよ");
}
function payAllow(){
  var a=R().allowance, cm=ym(todayStr()), mn=parseInt(cm.slice(5,7),10);
  if(!confirm(KNAME[curKid]+"に "+mn+"月のお小遣い "+yen(a)+"円 を渡した？")) return;
  addEntry(curKid,{date:todayStr(), type:"in", w:"use", cat:"お小遣い", memo:mn+"月分", amt:a, grp:uid(), allow:cm});
  save(); renderAll(); toast("💴 "+mn+"月のお小遣い "+yen(a)+"円 渡したよ！「使う」に入れたよ"); party();
}
function renderChores(){
  var el=document.getElementById("choreCard"); if(!el) return;
  var cm=ym(todayStr()), n=0, sm=0, log=K().choreLog;
  log.forEach(function(c){ if(ym(c.date)===cm){ n++; sm+=c.amt; } });
  var un=log.filter(function(c){return !c.paid;}), unSum=un.reduce(function(a,c){return a+c.amt;},0);
  var hd='<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">🧹 お手伝い</h3><button class="chedit" onclick="choreEdit=!choreEdit;renderChores()">'+(choreEdit?'完了':'✏️ 項目を決める')+'</button></div>';
  if(choreEdit){
    el.innerHTML=hd+'<div class="hint" style="margin-top:2px">お手伝いの名前と金額を自由に決めてね（Saku・Ao共通）</div>'
      +state.chores.map(function(c,i){ return '<div class="crow"><input type="text" value="'+esc(c.name)+'" maxlength="12" onchange="editChoreName('+i+',this.value)"><input class="n" type="number" value="'+c.amt+'" min="1" inputmode="numeric" onchange="editChoreAmt('+i+',this.value)"><span style="font-size:12px">円</span><button onclick="delChore('+i+')">×</button></div>'; }).join("")
      +'<div class="crow"><input type="text" id="chN" placeholder="例：ゴミ出し" maxlength="12"><input class="n" type="number" id="chA" placeholder="10" min="1" inputmode="numeric"><span style="font-size:12px">円</span><button style="background:var(--accent-deep);color:#fff" onclick="addChore()">追加</button></div>';
    return;
  }
  var paidH={}; log.forEach(function(c){ if(c.paid && c.payId) paidH[c.payId]=c.payDate; });

var AUTO_CATS={"利息":"利息","続けたごほうび":"ごほうび","定期預金の利息":"定期の利息","お年玉定期の利息":"お年玉の利息"};
function groupedRows(){
  var src=sortedWithBal(), out=[], byGrp={}, byAuto={}, last=null;
  src.forEach(function(o){
    var e=o.e, d=(e.type==="in"?e.amt:(e.type==="out"?-e.amt:0));
    var g=null;
    if(e.grp && byGrp[e.grp]) g=byGrp[e.grp];
    else if(e.sys && e.cat==="預金ボーナス" && !e.grp && last && last.date===e.date && !last.auto) g=last;
    else if(e.sys && AUTO_CATS[e.cat]){ var ak=ym(e.date); g=byAuto[ak]; if(!g){ g=byAuto[ak]={date:e.date, auto:true, items:[], net:0, bal:0, title:"🏦 銀行からのおまけ"}; out.push(g); } }
    else if(e.type==="move" && !e.grp){ return; }
    if(!g){ g={date:e.date, items:[], net:0, bal:0}; out.push(g); if(e.grp) byGrp[e.grp]=g; }
    g.items.push(e); g.net+=d; g.bal=o.bal;
    if(!g.auto) last=g;
  });
  return out.filter(function(g){
    var main=g.items.filter(function(x){return !x.sys;});
    if(g.auto) return true;
    if(!main.length) return true;
    if(main[0].type==="move" && g.net===0) return false;
    return true;
  }).map(function(g){
    var main=g.items.filter(function(x){return !x.sys;}), parts=[], m0=main[0]||g.items[0];
    if(g.auto){ g.items.forEach(function(x){ parts.push(AUTO_CATS[x.cat]+" "+yen(x.amt)+"円"); }); g.type="in"; if(g.items.every(function(x){return x.cat==="お年玉定期の利息";})) g.title="🧧 お年玉が ふえたよ！"; }
    else{
      if(m0.type==="move"){ g.title=WNAME[m0.w]+"から"+WNAME[m0.to]+"へ"; g.type="in"; }
      else { g.title=m0.cat||""; g.type=m0.type; }
      if(main.length>1) main.slice().sort(function(a,b){ var o={use:0,bank:1,give:2}; return o[a.w||"use"]-o[b.w||"use"]; }).forEach(function(x){ parts.push(WNAME[x.w||"use"]+" "+yen(x.amt)); });
      else if(m0.type!=="move") g.wtag=m0.w||"use";
      g.items.forEach(function(x){ if(x.sys && x.cat==="預金ボーナス") parts.push("ボーナス ＋"+yen(x.amt)+"円 🎁"); });
      if(m0.from) parts.push(m0.from); if(m0.memo && m0.type!=="move") parts.push(m0.memo);
      if(!g.items.every(function(x){return x.sys;})) g.ids=main.map(function(x){return x.id;});
      if(g.items.every(function(x){return x.sys;})){ g.title=m0.cat; g.type=m0.type==="out"?"out":"in"; if(m0.memo) parts.push(m0.memo); }
    }
    g.sub=parts.join("・"); g.amt=Math.abs(g.net); if(g.net<0) g.type="out";
    return g;
  });
}
function editGrp(i){ var g=window.__grs[i]; if(!g||!g.ids) return; if(g.items.some(function(x){return x.fx;})){ toast("お年玉定期は、消してから入れ直してね"); return; } if(g.items.some(function(x){return x.pay;})){ toast("お手伝い代は、消すと「まだもらってない」にもどるよ"); return; } if(g.ids.length===1) startEdit(g.ids[0]); else toast("分けて入れた記録は「くわしく」で1つずつなおせるよ"); }
function delGrp(i){
  var g=window.__grs[i]; if(!g||!g.ids) return;
  var hasFx=g.items.some(function(x){return x.fx;});

/* ===== 株ごっこ ===== */
function hashR(str){ var h=2166136261; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return ((h>>>0)%100000)/100000; }
var priceCache={};
function dayIdx(){ var n=daysBetween(STOCK_START,todayStr()); return n<0?0:n; }
function series(co){
  var n=dayIdx(), key=co.id+":"+n; if(priceCache[key]) return priceCache[key];
  var p=co.base, arr=[co.base];
  for(var i=1;i<=n;i++){ var z=hashR(co.id+":"+i)*2-1; p=p*(1+co.drift+co.vol*z); if(p<co.base*0.25) p=co.base*0.25; arr.push(Math.max(1,Math.round(p))); }
  priceCache[key]=arr; return arr;
}
function priceNow(co){ var a=series(co); return a[a.length-1]; }
function stockValue(k){ var v=0, st=state.kids[k].stocks; COS.forEach(function(co){ var h=st[co.id]; if(h&&h.sh>0) v+=h.sh*priceNow(co); }); return v; }
function spark(arr){
  var a=arr.slice(-30); if(a.length<2) a=[a[0],a[0]];
  var mn=Math.min.apply(null,a), mx=Math.max.apply(null,a), rg=(mx-mn)||1;
  var pts=a.map(function(v,i){ return Math.round(i/(a.length-1)*300)+","+Math.round(36-(v-mn)/rg*32); }).join(" ");
  var up=a[a.length-1]>=a[0];
  return '<svg viewBox="0 0 300 40" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="'+(up?"#d0604f":"#4f86b0")+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function renderStocks(){
  var kd=K(), s=sums(curKid);
  var tv=stockValue(curKid), cost=0; COS.forEach(function(co){ var h=kd.stocks[co.id]; if(h) cost+=h.cost; });
  var pl=tv-cost;
  var h='<div class="card"><h3>📈 株ごっこ</h3><div class="hint" style="margin-top:0;font-size:12.5px;color:var(--ink)">会社の「株」を買うと、その会社を少し応援する仲間になれるよ。株の値段は毎日 上がったり下がったりする。安いときに買って高いときに売ると「もうけ」、反対だと「そん」になるよ。買うお金は「使う」のおさいふから出すよ。</div>'
    +'<div class="irow"><span>使うのお金</span><span class="v" style="color:var(--accent-deep)">'+yen(s.use)+'円</span></div>'
    +'<div class="irow"><span>持っている株の いまの価値</span><span class="v">'+yen(tv)+'円</span></div>'
    +(cost>0?'<div class="irow"><span>ぜんぶの もうけ・そん</span><span class="v" style="color:'+(pl>=0?"#d0604f":"#4f86b0")+'">'+(pl>=0?"＋":"－")+yen(Math.abs(pl))+'円</span></div>':'')
    +'</div>';
  COS.forEach(function(co){
    var arr=series(co), p=arr[arr.length-1], prev=arr.length>1?arr[arr.length-2]:p, d=p-prev;
    var hd=kd.stocks[co.id], hold='';
    if(hd&&hd.sh>0){ var val=hd.sh*p, g=val-hd.cost; hold='<div class="hold">持っている株：<b>'+hd.sh+'株</b>（いまの価値 '+yen(val)+'円・'+(g>=0?'<span class="p">もうけ ＋'+yen(g)+'円</span>':'<span class="m">そん －'+yen(-g)+'円</span>')+'）</div>'; }
    h+='<div class="co"><div class="t"><span class="em">'+co.em+'</span><div class="nm"><b>'+co.name+'</b><small>'+co.desc+'</small></div>'
      +'<div class="pr"><b>'+yen(p)+'円</b><span class="'+(d>0?"up":(d<0?"dn":"fl"))+'">'+(d>0?"▲ "+yen(d):(d<0?"▼ "+yen(-d):"→ 0"))+'</span></div></div>'
      +spark(arr)+'<div class="hint" style="margin-top:0;text-align:right">さいきん30日の値段</div>'+hold
      +'<div class="trade"><input type="number" id="q_'+co.id+'" value="1" min="1" inputmode="numeric"><span>株</span><button class="mini-btn buy" onclick="buyStock(&#39;'+co.id+'&#39;)">買う</button>'+(hd&&hd.sh>0?'<button class="mini-btn sell" onclick="sellStock(&#39;'+co.id+'&#39;)">売る</button>':'')+'</div></div>';
  });
  h+='<div class="note">値段は毎日1回かわるよ（本物の会社ではなく、ごっこ遊びの会社です）。もうけ・そんは本当のおこづかいとして通帳に記録されるよ。</div>';
  document.getElementById("pg-stock").innerHTML=h;
}
function coById(id){ return COS.filter(function(c){return c.id===id;})[0]; }
function buyStock(id){
  var co=coById(id), q=parseInt(document.getElementById("q_"+id).value,10)||0; if(q<1){ toast("何株か入れてね"); return; }
  var p=priceNow(co), cost=p*q, s=sums(curKid);
  if(s.use<cost){ toast("使うのお金が足りないよ（"+yen(cost)+"円いる）"); return; }
  if(!confirm(co.name+"の株を "+q+"株（"+yen(cost)+"円）買う？")) return;
  var st=K().stocks; if(!st[id]) st[id]={sh:0, cost:0}; st[id].sh+=q; st[id].cost+=cost;
  addEntry(curKid,{date:todayStr(), type:"move", w:"use", to:"stock", cat:"株を買った", memo:co.name+" "+q+"株×"+yen(p)+"円", amt:cost, sys:true});
  save(); renderAll(); toast(co.em+" "+co.name+"の株を買ったよ！");
}
function sellStock(id){
  var co=coById(id), st=K().stocks, hd=st[id]; if(!hd||hd.sh<1) return;
  var q=parseInt(document.getElementById("q_"+id).value,10)||0; if(q<1){ toast("何株か入れてね"); return; } if(q>hd.sh){ toast(hd.sh+"株まで売れるよ"); return; }
  var p=priceNow(co), get=p*q, basis=Math.round(hd.cost*q/hd.sh), diff=get-basis;
  if(!confirm(co.name+"の株を "+q+"株 売る？（"+yen(get)+"円・"+(diff>=0?"もうけ ＋"+yen(diff):"そん －"+yen(-diff))+"円）")) return;
  var t=todayStr();
  addEntry(curKid,{date:t, type:"move", w:"stock", to:"use", cat:"株を売った", memo:co.name+" "+q+"株×"+yen(p)+"円", amt:basis, sys:true});
  if(diff>0) addEntry(curKid,{date:t, type:"in", w:"use", cat:"株のもうけ", memo:co.name, amt:diff, sys:true});
  if(diff<0) addEntry(curKid,{date:t, type:"out", w:"use", cat:"株のそん", memo:co.name, amt:-diff, sys:true});
  hd.sh-=q; hd.cost-=basis; if(hd.sh<=0) delete st[id];
  save(); renderAll();
  if(diff>0){ toast("売ったよ！ もうけ ＋"+yen(diff)+"円🎉"); party(); } else if(diff<0) toast("売ったよ。そん －"+yen(-diff)+"円… 次はどうする？"); else toast("売ったよ");
}
