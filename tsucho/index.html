<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="通帳">
<meta name="theme-color" content="#eef3f7">
<title>SakuとAoの通帳</title>
<style>
@font-face{font-family:"Uzura";src:url("../uzura.ttf") format("truetype");font-display:swap;}

  :root{
    --cream:#eef3f7;--paper:#ffffff;--ink:#4d5560;--ink-soft:#98a1ad;
    --saku:#6f9ec0;--saku-deep:#4f83a8;--ao:#7bb89a;--ao-deep:#5a9c7c;
    --in:#6faf7f;--in-deep:#4f9264;--out:#e0917d;--out-deep:#cc7159;
    --gold:#e6bd6a;--gold-deep:#c99a3e;--pink:#ec9fb0;--pink-deep:#cf7189;
    --line:#e2e9ef;--shadow:rgba(90,120,150,.15);
    --accent:#6f9ec0;--accent-deep:#4f83a8;
  }
  body.ao{--accent:#7bb89a;--accent-deep:#5a9c7c;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Uzura","Hiragino Maru Gothic ProN",sans-serif;
    background:radial-gradient(circle at 14% 6%,rgba(111,158,192,.14),transparent 44%),
      radial-gradient(circle at 86% 94%,rgba(123,184,154,.14),transparent 44%),var(--cream);
    color:var(--ink);min-height:100vh;padding:15px 12px 96px;display:flex;justify-content:center;}
  .app{width:100%;max-width:460px;}
  .head{text-align:center;margin:2px 0 10px;}
  .head .deco{font-size:13px;color:var(--accent-deep);letter-spacing:.08em;}
  .head h1{font-size:22px;letter-spacing:.03em;margin-top:2px;color:var(--accent-deep);}

  .tabs{display:flex;gap:8px;margin:12px 0 14px;}
  .tabk{flex:1;text-align:center;font-family:inherit;font-size:17px;color:var(--ink-soft);
    background:var(--paper);border:2px solid var(--line);padding:12px 0;border-radius:16px;cursor:pointer;box-shadow:0 2px 8px var(--shadow);}
  .tabk.on[data-k="saku"]{background:var(--saku);border-color:var(--saku);color:#fff;}
  .tabk.on[data-k="ao"]{background:var(--ao);border-color:var(--ao);color:#fff;}

  .bal{background:linear-gradient(160deg,#fff,#f3f8fb);border:1px solid var(--line);border-radius:22px;
    padding:18px 16px 14px;text-align:center;box-shadow:0 6px 18px var(--shadow);margin-bottom:14px;}
  .bal .lbl{font-size:13px;color:var(--ink-soft);}
  .bal .amt{font-size:38px;color:var(--accent-deep);line-height:1.2;}
  .bal .amt small{font-size:18px;}
  .wallets{display:flex;gap:6px;margin-top:10px;}
  .wl{flex:1;border-radius:13px;padding:7px 4px;font-size:11px;line-height:1.4}
  .wl b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
  .wl.use{background:#e9f1f8;color:var(--accent-deep)} body.ao .wl.use{background:#e6f3ec}
  .wl.bank{background:#fbf1dc;color:var(--gold-deep)}
  .wl.give{background:#fbe8ee;color:var(--pink-deep)}
  .wl.etc{background:#f1f3f6;color:#7a8492}
  .bal .sub{font-size:11px;color:var(--ink-soft);margin-top:7px}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:15px 14px;
    box-shadow:0 5px 16px var(--shadow);margin-bottom:14px;}
  .card h3{font-size:15px;color:var(--accent-deep);margin-bottom:8px}
  .seg{display:flex;gap:6px;margin-bottom:12px;}
  .seg button{flex:1;font-family:inherit;font-size:14px;border:2px solid var(--line);background:var(--cream);
    color:var(--ink-soft);border-radius:13px;padding:10px 0;cursor:pointer;}
  .seg button.on.in{background:var(--in);border-color:var(--in);color:#fff;}
  .seg button.on.out{background:var(--out);border-color:var(--out);color:#fff;}
  .seg button.on.move{background:var(--gold);border-color:var(--gold);color:#fff;}
  .f-label{font-size:12px;font-weight:700;color:var(--ink-soft);margin:11px 2px 6px;}
  input[type=date],input[type=text],input[type=number],select{width:100%;font-family:inherit;font-size:15px;color:var(--ink);
    background:var(--cream);border:1.5px solid var(--line);border-radius:13px;padding:10px 12px;outline:none;-webkit-appearance:none;}
  input:focus,select:focus{border-color:var(--accent);}
  .yen-row{position:relative;}
  .yen-row::after{content:"円";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:700;color:var(--ink-soft);}
  .yen-row input{font-size:20px;padding:12px 42px 12px 14px;font-variant-numeric:tabular-nums;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{font-family:inherit;font-size:12.5px;color:var(--ink-soft);background:var(--cream);
    border:1.5px solid var(--line);border-radius:99px;padding:8px 12px;cursor:pointer;}
  .chip.sel{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff;}
  .chip.w-use.sel{background:var(--accent-deep);border-color:var(--accent-deep)}
  .chip.w-bank.sel{background:var(--gold-deep);border-color:var(--gold-deep)}
  .chip.w-give.sel{background:var(--pink-deep);border-color:var(--pink-deep)}
  .chip.w-split.sel{background:#7a8492;border-color:#7a8492}
  .chip.add{border-style:dashed;}
  .chip.editing{border-color:#e0a9a4;color:#c4756f;}
  .hint{font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.6}
  .save-btn{display:block;width:100%;margin-top:14px;font-family:inherit;font-size:17px;color:#fff;
    background:var(--accent-deep);border:none;border-radius:15px;padding:13px;cursor:pointer;}
  .sub-btn{display:block;width:100%;margin-top:8px;font-family:inherit;font-size:13px;color:var(--ink-soft);
    background:transparent;border:none;cursor:pointer;padding:8px;}
  .mini-btn{font-family:inherit;font-size:12.5px;border:none;border-radius:11px;padding:8px 12px;cursor:pointer;background:var(--accent-deep);color:#fff}
  .mini-btn.ghost{background:var(--cream);color:var(--ink-soft);border:1.5px solid var(--line)}

  .sec-title{font-size:13px;color:var(--ink-soft);margin:4px 4px 8px;}
  .listmode{display:flex;gap:6px;margin:4px 0 10px}
  .listmode .lm{flex:1;padding:8px 0;border:2px solid var(--accent-deep);border-radius:12px;background:#fff;font-family:inherit;font-size:13px;color:var(--accent-deep);cursor:pointer}
  .listmode .lm.on{background:var(--accent-deep);color:#fff}
  .row{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);
    border-radius:14px;padding:11px 13px;box-shadow:0 3px 9px var(--shadow);margin-bottom:8px;}
  .row .r-date{flex:0 0 auto;font-size:11px;color:var(--ink-soft);width:38px;text-align:center;line-height:1.3;}
  .row .r-mid{flex:1;min-width:0;cursor:pointer;}
  .row .r-cat{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .r-memo{font-size:11px;color:var(--ink-soft);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .r-amt{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .row .r-amt.in{color:var(--in-deep);} .row .r-amt.out{color:var(--out-deep);} .row .r-amt.move{color:var(--gold-deep)}
  .row .r-bal{font-size:10.5px;color:var(--ink-soft);text-align:right;min-width:58px;font-variant-numeric:tabular-nums;}
  .row .del{flex:0 0 auto;width:24px;height:24px;border:none;background:transparent;color:var(--ink-soft);font-size:16px;cursor:pointer;opacity:.4;}
  .wtag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:99px;margin-left:4px;vertical-align:middle}
  .wtag.use{background:#e9f1f8;color:var(--accent-deep)} body.ao .wtag.use{background:#e6f3ec}
  .wtag.bank{background:#fbf1dc;color:var(--gold-deep)}
  .wtag.give{background:#fbe8ee;color:var(--pink-deep)}
  .wtag.fixed,.wtag.stock{background:#f1f3f6;color:#7a8492}
  .edit-hint{color:var(--accent-deep);}
  .empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:22px 10px;line-height:1.9;}
  .ptable{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .ptable th,.ptable td{padding:8px 6px;border-bottom:1px dashed #e6dcc6;text-align:right}
  .ptable th{background:#f6efdd;color:#8a7a53;font-weight:700;text-align:center;font-size:11px}
  .ptable td.dt{text-align:center;white-space:nowrap;color:#8a7a53}
  .ptable td.ct{text-align:left;color:#4d5560;line-height:1.35}
  .ptable td.inc{color:#2f8a5b;font-weight:700;white-space:nowrap}
  .ptable td.exp{color:#c0453b;font-weight:700;white-space:nowrap}
  .ptable td.bal{font-weight:700;color:#4d5560;white-space:nowrap}
  .ptable tr:last-child td{border-bottom:none}

  /* 銀行 */
  .bank-top{background:linear-gradient(160deg,#fffaf0,#fbf0d8);border:1px solid #f0e1bd;border-radius:22px;padding:18px 16px;text-align:center;box-shadow:0 6px 18px rgba(201,154,62,.18);margin-bottom:14px}
  .bank-top .lbl{font-size:13px;color:var(--gold-deep)}
  .bank-top .amt{font-size:36px;color:var(--gold-deep);line-height:1.25}
  .bank-top .amt small{font-size:17px}
  .bank-top .rate{display:inline-block;margin-top:4px;background:#fff;border-radius:99px;padding:3px 12px;font-size:12px;color:var(--gold-deep)}
  .bank-info{font-size:12.5px;color:var(--ink);line-height:1.8;margin-top:10px}
  .bank-info b{color:var(--gold-deep)}
  .irow{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .irow:last-child{border-bottom:none}
  .irow .v{color:var(--gold-deep);font-weight:700}
  .fx{border:1.5px solid #f0e1bd;border-radius:14px;padding:10px 12px;margin-bottom:8px;background:#fffdf7}
  .fx .t{display:flex;justify-content:space-between;font-size:14px}
  .fx .t b{color:var(--gold-deep)}
  .fx .s{font-size:11.5px;color:var(--ink-soft);margin-top:3px}
  .bar{height:9px;border-radius:99px;background:#f1e8d4;overflow:hidden;margin-top:7px}
  .bar span{display:block;height:100%;border-radius:99px;background:var(--gold)}
  .bar.gbar span{background:var(--accent)}
  .fx .acts{display:flex;justify-content:flex-end;margin-top:6px}
  .fx .acts button{border:none;background:none;font-family:inherit;font-size:11.5px;color:#c4756f;cursor:pointer}
  .frow{display:flex;gap:6px;margin-top:6px}
  .frow>*{flex:1}
  .sim{display:flex;align-items:flex-end;gap:10px;height:150px;margin:14px 2px 6px;padding-top:10px}
  .sim .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .sim .bars{display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center;flex:1}
  .sim .b1{width:40%;background:#d8dee6;border-radius:6px 6px 0 0}
  .sim .b2{width:40%;background:var(--gold);border-radius:6px 6px 0 0}
  .sim .yl{font-size:11.5px;color:var(--ink-soft);margin-top:4px}
  .sim .vl{font-size:10.5px;color:var(--gold-deep);font-weight:700;white-space:nowrap}
  .legend{font-size:11px;color:var(--ink-soft);display:flex;gap:12px;justify-content:center}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
  .set-row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}
  .set-row label{flex:1}
  .set-row input{width:90px;flex:0 0 90px;padding:8px 10px;font-size:14px;text-align:right}
  details summary{cursor:pointer;font-size:13px;color:var(--ink-soft);list-style:none}
  details summary::-webkit-details-marker{display:none}

  /* ほしい */
  .goal{border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px}
  .goal .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .goal .t .n{font-size:15px;flex:1;min-width:0}
  .goal .t .g{font-size:13px;color:var(--accent-deep);white-space:nowrap}
  .goal .s{font-size:12px;color:var(--ink);margin-top:5px;line-height:1.6}
  .goal .done{color:var(--in-deep);font-weight:700}
  .goal .acts{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}

  /* 株 */
  .co{border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:#fff}
  .co .t{display:flex;align-items:center;gap:8px}
  .co .em{font-size:26px}
  .co .nm{flex:1;min-width:0}
  .co .nm b{display:block;font-size:15px}
  .co .nm small{font-size:11px;color:var(--ink-soft)}
  .co .pr{text-align:right}
  .co .pr b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
  .co .up{color:#d0604f;font-size:11.5px} .co .dn{color:#4f86b0;font-size:11.5px} .co .fl{color:var(--ink-soft);font-size:11.5px}
  .co svg{display:block;width:100%;height:40px;margin-top:6px}
  .co .hold{font-size:12px;margin-top:6px;color:var(--ink)}
  .co .hold .p{color:#d0604f} .co .hold .m{color:#4f86b0}
  .co .trade{display:flex;gap:6px;align-items:center;margin-top:8px}
  .co .trade input{width:70px;flex:0 0 70px;padding:7px 8px;font-size:14px;text-align:center}
  .co .trade span{font-size:12px;color:var(--ink-soft)}
  .co .trade .buy{background:#d0604f} .co .trade .sell{background:#4f86b0}
  .note{font-size:11.5px;color:var(--ink-soft);line-height:1.7;margin:2px 4px 10px}

  .tabbar{position:fixed;bottom:0;left:0;right:0;max-width:460px;margin:0 auto;display:flex;background:var(--paper);
    box-shadow:0 -2px 10px var(--shadow);padding-bottom:env(safe-area-inset-bottom);z-index:20;border-radius:16px 16px 0 0}
  .tabbar button{flex:1;border:none;background:none;padding:10px 0 9px;font-family:inherit;font-size:12px;color:var(--ink-soft)}
  .tabbar button .ic{display:block;font-size:20px;line-height:1.2}
  .tabbar button.on{color:var(--accent-deep)}
  .page{display:none}
  .page.on{display:block}

  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(80px);background:var(--ink);
    color:#fff;font-size:14px;padding:12px 22px;border-radius:99px;box-shadow:0 6px 20px var(--shadow);
    z-index:80;opacity:0;transition:.35s cubic-bezier(.34,1.56,.64,1);max-width:90vw;text-align:center;}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
  .party{position:fixed;font-size:24px;pointer-events:none;z-index:70;animation:fall 1.6s ease-in forwards}
  @keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(160px) rotate(240deg)}}

  .bkx{margin:20px 2px 10px;background:var(--paper);border:1px solid var(--line);border-radius:18px;
    padding:14px 16px;box-shadow:0 4px 12px var(--shadow);font-size:12px;color:var(--ink-soft);line-height:1.7}
  .bkx h3{font-size:13.5px;color:var(--ink);margin-bottom:4px;}
  .bkx .bkx-btn{border:none;border-radius:12px;padding:9px 16px;font-family:inherit;font-size:12.5px;
    color:#fff;background:var(--saku);margin:8px 8px 0 0;cursor:pointer}
  .bkx .bkx-btn.sub{background:#c3ccd6}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="deco" id="deco">＼ お金の 出入り・残高 ／</div>
    <h1 id="title">通帳</h1>
  </div>

  <div class="tabs">
    <button class="tabk on" data-k="saku" onclick="setKid('saku')">Saku</button>
    <button class="tabk" data-k="ao" onclick="setKid('ao')">Ao</button>
  </div>

  <div class="bal">
    <div class="lbl"><span id="balName">Saku</span>の お金 ぜんぶ</div>
    <div class="amt"><span id="balAmt">0</span><small> 円</small></div>
    <div class="wallets" id="wallets"></div>
    <div class="sub" id="balSub"></div>
  </div>

  <!-- 通帳 -->
  <div class="page on" id="pg-book">
    <div class="card">
      <div class="seg">
        <button class="in on" id="segIn" onclick="setType('in')">＋ 入金</button>
        <button class="out" id="segOut" onclick="setType('out')">－ 出金</button>
        <button class="move" id="segMove" onclick="setType('move')">⇔ 移す</button>
      </div>
      <div class="f-label">金額</div>
      <div class="yen-row"><input type="number" id="fAmt" placeholder="0" min="0" inputmode="numeric" oninput="renderSplitHint()"></div>
      <div id="wBox"></div>
      <div id="catBox">
        <div class="f-label">分類</div>
        <div class="chips" id="catChips"></div>
      </div>
      <div id="fromBox">
        <div class="f-label">だれから？（なくてもOK）</div>
        <input type="text" id="fFrom" placeholder="例：おばあちゃん" maxlength="16">
      </div>
      <div class="f-label">日付</div>
      <input type="date" id="fDate">
      <div class="f-label">メモ（なくてもOK）</div>
      <input type="text" id="fMemo" placeholder="例：誕生日に" maxlength="24">
      <button class="save-btn" id="saveBtn" onclick="saveEntry()">記入する</button>
      <button class="sub-btn" id="cancelEdit" style="display:none" onclick="endEdit(true)">編集をやめる</button>
    </div>

    <div class="sec-title">通帳（新しい順）</div>
    <div class="listmode"><button class="lm on" id="lmCard" onclick="setListMode('card')">カード</button><button class="lm" id="lmTable" onclick="setListMode('table')">一覧表</button></div>
    <div id="list"></div>
    <div id="tableWrap" style="display:none"></div>
  </div>

  <!-- 銀行 -->
  <div class="page" id="pg-bank"></div>
  <!-- ほしい -->
  <div class="page" id="pg-goal"></div>
  <!-- 株 -->
  <div class="page" id="pg-stock"></div>

  <div class="bkx">
    <h3>💾 データのバックアップ</h3>
    通帳の記録はこの端末のブラウザ内に保存されています。ときどきファイルに書き出しておくと、機種変更やお引っ越しでも安心です。<br>
    <button class="bkx-btn" id="bkxExp">書き出す</button><button class="bkx-btn sub" id="bkxImpBtn">読み込む</button>
    <input type="file" id="bkxImp" accept=".json" style="display:none">
  </div>
</div>

<nav class="tabbar">
  <button class="on" id="tb-book" onclick="showPage('book')"><span class="ic">📒</span>通帳</button>
  <button id="tb-bank" onclick="showPage('bank')"><span class="ic">🏦</span>銀行</button>
  <button id="tb-goal" onclick="showPage('goal')"><span class="ic">⭐</span>ほしい</button>
  <button id="tb-stock" onclick="showPage('stock')"><span class="ic">📈</span>株</button>
</nav>

<div class="toast" id="toast"></div>

<script>
var KEY="tsucho_v1";
var DEF_IN=["お小遣い","お年玉","お手伝い","プレゼント","その他"];
var DEF_OUT=["お菓子・ジュース","おもちゃ","本","寄付","その他"];
var KNAME={saku:"Saku", ao:"Ao"};
var WNAME={use:"使う", bank:"預金", give:"あげる", fixed:"定期預金", stock:"株"};
var COS=[
  {id:"pan",  em:"🍞", name:"くまのパン屋",   desc:"毎日みんなが買うパン屋さん。値動きはおだやか", base:100, vol:0.018, drift:0.0006},
  {id:"toy",  em:"🧸", name:"おもちゃ工場",   desc:"クリスマス前は人気かも？",               base:150, vol:0.025, drift:0.0004},
  {id:"park", em:"🎡", name:"どうぶつ遊園地", desc:"お天気しだいでお客さんが変わる",           base:200, vol:0.032, drift:0.0005},
  {id:"rkt",  em:"🚀", name:"ロケット工業",   desc:"大きく上がることも下がることもある",       base:300, vol:0.05,  drift:0.0008}
];
var STOCK_START="2026-10-01";

var state={kids:{}, catsIn:null, catsOut:null, bank:null};
var curKid="saku", curPage="book", selType="in", selCatIn="", selCatOut="", editCats=false, editId=null;
var selW="use", moveFrom="use", moveTo="bank", listMode="card";

function newKid(){ return {entries:[], fixed:[], goals:[], stocks:{}, lastInterest:""}; }
function load(){
  try{ var v=localStorage.getItem(KEY); if(v){ var s=JSON.parse(v); for(var k in s) state[k]=s[k]; } }catch(e){}
  if(!state.kids) state.kids={};
  ["saku","ao"].forEach(function(k){
    var kd=state.kids[k]; if(!kd) kd=state.kids[k]=newKid();

function sums(k){
  var s={use:0,bank:0,give:0,fixed:0,stock:0};
  state.kids[k].entries.forEach(function(e){
    var w=e.w||"use";
    if(e.type==="in") s[w]+=e.amt; else if(e.type==="out") s[w]-=e.amt;
    else if(e.type==="move"){ s[w]-=e.amt; s[e.to]=(s[e.to]||0)+e.amt; }
  });
  return s;
}
function total(s){ return s.use+s.bank+s.give+s.fixed+s.stock; }
function addEntry(k, o){ o.id=o.id||uid(); state.kids[k].entries.push(o); return o; }

/* ===== 利息と定期の自動処理 ===== */
function ym(ds){ return (""+ds).slice(0,7); }
function nextYm(s){ var y=parseInt(s.slice(0,4),10), m=parseInt(s.slice(5,7),10)+1; if(m>12){m=1;y++;} return y+"-"+pad2(m); }
function processBank(k){
  var kd=state.kids[k], got=0, msgs=[];
  var cur=ym(todayStr());
  if(!kd.lastInterest){ kd.lastInterest=cur; }
  var guard=0;
  while(kd.lastInterest<cur && guard<240){
    guard++;
    var nm=nextYm(kd.lastInterest);
    var bal=sums(k).bank;
    var amt=Math.floor(Math.max(0,bal)*state.bank.rate/1200);
    if(amt>0){ addEntry(k,{date:nm+"-01", type:"in", w:"bank", cat:"利息", memo:"年利"+state.bank.rate+"%", amt:amt, sys:true}); got+=amt; }
    kd.lastInterest=nm;
  }
  if(got>0) msgs.push("預金に利息がついたよ！ ＋"+yen(got)+"円");
  var t=todayStr();
  kd.fixed.forEach(function(f){
    if(f.status!=="active") return;
    var mat=addMonths(f.start, f.months);
    if(t>=mat){
      addEntry(k,{date:mat, type:"move", w:"fixed", to:"bank", cat:"定期預金 満期", memo:f.months+"か月", amt:f.amt, sys:true});
      var it=Math.floor(f.amt*f.rate/100*f.months/12);
      if(it>0) addEntry(k,{date:mat, type:"in", w:"bank", cat:"定期預金の利息", memo:"年利"+f.rate+"%", amt:it, sys:true});
      f.status="done"; f.end=mat; f.interest=it;
      msgs.push("定期預金が満期！ 利息 ＋"+yen(it)+"円");
    }
  });
  return msgs;
}
function runAuto(){
  var mine=[];
  ["saku","ao"].forEach(function(k){ var m=processBank(k); if(k===curKid) mine=m; });
  save();
  if(mine.length){ setTimeout(function(){ toast(mine.join(" / ")+" 🎉"); party(); }, 500); }
}

function hashR(str){ var h=2166136261; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return ((h>>>0)%100000)/100000; }

    a.download=APP+"-backup-"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+".json";
    a.click();URL.revokeObjectURL(a.href);
  });
  document.getElementById("bkxImpBtn").addEventListener("click",function(){document.getElementById("bkxImp").click();});
  document.getElementById("bkxImp").addEventListener("change",function(ev){
    var f=ev.target.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){
      try{var j=JSON.parse(r.result);var data=j.__bkx?j.data:j;
        if(typeof data!=="object"||!data)throw 0;
        if(!confirm("今の内容を読み込んだ内容で置き換えます。よろしいですか？"))return;
        Object.keys(data).forEach(function(k){localStorage.setItem(k,data[k]);});
        alert("読み込みました。画面を更新します。");location.reload();
      }catch(e){alert("このファイルは読み込めませんでした");}
    };
    r.readAsText(f);ev.target.value="";
  });
})();
</script>
