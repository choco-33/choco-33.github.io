<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="整理整頓">
<meta name="theme-color" content="#7cb6a6">
<title>整理整頓</title>
<style>
@font-face{font-family:"Azuki";src:url("../azukiP.ttf") format("truetype");font-display:swap;}

  :root{
    --bg:#f2f7f5; --card:#ffffff; --text:#41504a; --sub:#93a49d;
    --accent:#7cb6a6; --accent-dark:#579685; --mint:#a8d8c8;
    --ok:#7ec8a9; --warn:#f5c26b; --bad:#ef8a80; --none:#d6ddd8;
    --shadow:0 2px 10px rgba(90,150,133,.13);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Azuki","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--bg); color:var(--text);
    max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:84px;
  }
  header{text-align:center; padding:18px 16px 8px}
  header h1{font-size:21px; letter-spacing:2px; display:flex; align-items:center; justify-content:center; gap:8px}
  header h1 svg{width:27px; height:27px}
  header p{font-size:12px; color:var(--sub); margin-top:3px}

  .tabbar{
    position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto;
    display:flex; background:var(--card); box-shadow:0 -2px 10px rgba(90,150,133,.15);
    padding-bottom:env(safe-area-inset-bottom); z-index:5;
  }
  .tabbar button{flex:1; border:none; background:none; padding:11px 0 9px; font-size:11.5px; color:var(--sub); font-family:inherit}
  .tabbar button .ico{display:flex; justify-content:center; margin-bottom:3px}
  .tabbar button .ico svg{width:22px; height:22px}
  .tabbar button.active{color:var(--accent-dark); font-weight:bold}

  .page{display:none; padding:0 14px}
  .page.active{display:block}

  .card{background:var(--card); border-radius:18px; box-shadow:var(--shadow); margin-bottom:10px; overflow:hidden}
  .sec-note{font-size:12px; color:var(--sub); margin:12px 4px 8px; line-height:1.6}

  /* 片付け */
  .proj-head{display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer; user-select:none}
  .proj-head .picon{width:28px;height:28px;flex-shrink:0}
  .proj-head .picon svg{width:100%;height:100%}
  .proj-head .pname{font-size:15px; font-weight:bold; flex:1; min-width:0}
  .proj-head .pcount{font-size:11px; color:var(--sub)}
  .proj-head .arrow{font-size:12px; color:var(--sub); transition:.2s}
  .card.open .arrow{transform:rotate(90deg)}
  .pbar{height:7px; border-radius:99px; background:#eef3f0; margin:0 14px 12px; overflow:hidden}
  .pbar span{display:block; height:100%; background:var(--ok); border-radius:99px; transition:width .3s}
  .proj-body{display:none; border-top:1.5px dashed #eef1ee; padding:6px 12px 12px}
  .card.open .proj-body{display:block}

  .task{display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid #f4f8f6}
  .task:last-of-type{border-bottom:none}
  .check{width:30px;height:30px;border-radius:10px;border:2px solid #dfe8e4;background:#fdfffe;font-size:16px;line-height:1;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:transparent;cursor:pointer}
  .task.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
  .task .tname{flex:1;font-size:14px;min-width:0}
  .task.done .tname{color:var(--sub);text-decoration:line-through}
  .task .tdel{border:none;background:none;color:#d7ddd9;font-size:14px;padding:6px}

  .row-add{display:flex; gap:6px; margin-top:10px}
  .row-add input{flex:1;border:1.5px solid #dfe8e4;border-radius:12px;padding:8px 12px;font-family:inherit;font-size:13px;background:#fdfffe;color:var(--text);outline:none;min-width:0}
  .row-add input:focus{border-color:var(--accent)}
  .row-add button{border:none;background:var(--mint);color:#fff;font-family:inherit;font-weight:bold;font-size:13px;padding:0 14px;border-radius:12px}

  .photos{display:flex; gap:8px; margin-top:12px}
  .photo{flex:1; text-align:center}
  .photo .plabel{font-size:11px; color:var(--sub); margin-bottom:4px}
  .photo .pbox{aspect-ratio:4/3; border-radius:12px; border:2px dashed #d7e0dc; background:#fafcfb; display:flex; align-items:center; justify-content:center; color:#b7c4bf; font-size:12px; overflow:hidden; position:relative}
  .photo .pbox img{width:100%; height:100%; object-fit:cover}
  .photo .pbox .rm{position:absolute; top:4px; right:4px; background:rgba(65,80,74,.7); color:#fff; border:none; border-radius:99px; width:22px; height:22px; font-size:13px}

  .proj-foot{display:flex; justify-content:flex-end; padding:4px 4px 0}
  .proj-foot button{border:none;background:none;color:#c3ccc7;font-size:11.5px;font-family:inherit;padding:6px}

  .add-big{display:flex; gap:6px; margin:6px 2px 4px}
  .add-big input{flex:1;border:1.5px solid #dfe8e4;border-radius:14px;padding:11px 14px;font-family:inherit;font-size:14px;background:var(--card);color:var(--text);outline:none;min-width:0;box-shadow:var(--shadow)}
  .add-big input:focus{border-color:var(--accent)}
  .add-big button{border:none;background:var(--accent);color:#fff;font-family:inherit;font-weight:bold;font-size:14px;padding:0 18px;border-radius:14px}

  /* 断捨離 */
  .summary{display:flex; gap:10px; padding:2px 2px 12px}
  .summary .box{flex:1;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:11px 6px;text-align:center}
  .summary .num{font-size:22px;font-weight:bold;color:var(--accent-dark)}
  .summary .label{font-size:10px;color:var(--sub);margin-top:2px}
  .goal-card{padding:12px 14px}
  .goal-card .gtop{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:8px}
  .goal-card .gset{border:none;background:none;color:var(--accent-dark);font-family:inherit;font-size:12px;text-decoration:underline}
  .goal-bar{height:10px;border-radius:99px;background:#eef3f0;overflow:hidden}
  .goal-bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

  .day-group{margin-bottom:14px}
  .day-group h3{font-size:12.5px;color:var(--sub);margin:0 4px 6px}
  .d-item{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 14px;margin-bottom:6px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .d-item .ddel{border:none;background:none;color:#d7ddd9;font-size:13px;padding:2px 4px}

  /* 定位置 */
  .search-box{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:9px 14px;margin:2px 2px 12px}
  .search-box svg{width:18px;height:18px;flex-shrink:0}
  .search-box input{flex:1;border:none;outline:none;font-family:inherit;font-size:14px;background:none;color:var(--text);min-width:0}
  .cat-group{margin-bottom:14px}
  .cat-group h3{font-size:12.5px;color:var(--accent-dark);margin:0 4px 6px;font-weight:bold}
  .i-item{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
  .i-item .iname{font-size:14px;font-weight:bold}
  .i-item .iplace{font-size:12px;color:var(--sub);margin-top:1px;display:flex;align-items:center;gap:4px}
  .i-item .iplace svg{width:13px;height:13px}
  .i-item .iinfo{flex:1;min-width:0}
  .i-item .idel{border:none;background:none;color:#d7ddd9;font-size:13px;padding:6px}
  .item-add{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;margin-top:6px}
  .item-add .fld{margin-bottom:8px}
  .item-add .fld label{font-size:11px;color:var(--sub);display:block;margin-bottom:3px}
  .item-add input{width:100%;border:1.5px solid #dfe8e4;border-radius:12px;padding:9px 12px;font-family:inherit;font-size:13.5px;background:#fdfffe;color:var(--text);outline:none}
  .item-add input:focus{border-color:var(--accent)}
  .item-add .iadd-btn{width:100%;border:none;background:var(--accent);color:#fff;font-family:inherit;font-weight:bold;font-size:14px;padding:11px;border-radius:12px;margin-top:2px}

  /* 見直し */
  .m-item{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:11px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
  .m-item .minfo{flex:1;min-width:0}
  .m-item .mname{font-size:14.5px;font-weight:bold}
  .m-item .mlast{font-size:11px;margin-top:2px}
  .mlast.ok{color:var(--ok)} .mlast.warn{color:#d9a13f} .mlast.bad{color:var(--bad)} .mlast.none{color:var(--sub)}
  .m-item .mbtn{border:none;background:var(--mint);color:#fff;font-family:inherit;font-weight:bold;font-size:12px;padding:8px 12px;border-radius:11px;flex-shrink:0}
  .m-item .mdel{border:none;background:none;color:#d7ddd9;font-size:13px;padding:4px}

  .empty{text-align:center;color:var(--sub);font-size:13px;padding:34px 0;line-height:2}

  #toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;font-size:14px;padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap;z-index:10}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .confetti{position:fixed;font-size:20px;pointer-events:none;z-index:9;animation:fall 1.1s ease-in forwards}
  @keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(110px) rotate(200deg)}}

  .bkx{margin:18px 4px 30px;background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);font-size:12px;color:#8a978f;line-height:1.7}
  .bkx h3{font-size:13.5px;color:#4c5a53;margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .bkx h3 svg{width:18px;height:18px}
  .bkx .bkx-btn{border:none;border-radius:12px;padding:9px 16px;font-family:inherit;font-weight:700;font-size:12.5px;color:#fff;background:#9cbcae;margin:8px 8px 0 0;cursor:pointer}
  .bkx .bkx-btn.sub{background:#c2ccc6}
</style>
</head>
<body>
<header>
  <h1><span id="hIcon"></span>整理整頓</h1>
  <p id="sub">おうちを ととのえる きろく</p>
</header>

<div id="pageKata" class="page active"></div>
<div id="pageDan" class="page"></div>
<div id="pageTeii" class="page"></div>
<div id="pageMina" class="page"></div>

<nav class="tabbar">
  <button id="tabKata" class="active" onclick="showPage('Kata')"><span class="ico" data-icon="box"></span>片付け</button>
  <button id="tabDan" onclick="showPage('Dan')"><span class="ico" data-icon="bag"></span>断捨離</button>
  <button id="tabTeii" onclick="showPage('Teii')"><span class="ico" data-icon="pin"></span>定位置</button>
  <button id="tabMina" onclick="showPage('Mina')"><span class="ico" data-icon="refresh"></span>見直し</button>
</nav>

<div id="toast"></div>

<div class="bkx">
  <h3><svg viewBox="0 0 48 48" fill="none" stroke="#5b6b63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 7 V25 M17 19 L24 26 L31 19"/><path d="M8 29 V35 Q8 40 13 40 H35 Q40 40 40 35 V29"/></svg> データのバックアップ</h3>
  記録はこの端末のブラウザ内に保存されています。ときどきファイルに書き出しておくと、機種変更やお引っ越しでも安心です。<br>
  <button class="bkx-btn" id="bkxExp">書き出す</button><button class="bkx-btn sub" id="bkxImpBtn">読み込む</button>
  <input type="file" id="bkxImp" accept=".json" style="display:none">
</div>

<script>
const KEY = "seiri-v1";

const SVG_OPEN = '<svg viewBox="0 0 48 48" fill="none" stroke="#5b6b63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">';
const ICONS = {
  box: SVG_OPEN+'<rect x="8" y="20" width="32" height="20" rx="3" fill="#bfe0d4"/><path d="M8 27 H40" stroke-width="2.5"/><rect x="21" y="23" width="6" height="2.6" rx="1.3" fill="#5b6b63" stroke="none"/><rect x="21" y="32" width="6" height="2.6" rx="1.3" fill="#5b6b63" stroke="none"/><path d="M12 20 L16 12 H32 L36 20" fill="#d8efe6"/></svg>',
  bag: SVG_OPEN+'<path d="M14 18 H34 L32 40 H16 Z" fill="#cfe7dd"/><path d="M18 18 Q18 10 24 10 Q30 10 30 18" stroke-width="2.6"/><path d="M20 25 H28" stroke-width="2.2"/></svg>',
  pin: SVG_OPEN+'<path d="M24 42 C24 42 12 28 12 19 A12 12 0 0 1 36 19 C36 28 24 42 24 42 Z" fill="#f4b8a0"/><circle cx="24" cy="19" r="4.5" fill="#fff" stroke-width="2.4"/></svg>',
  refresh: SVG_OPEN+'<path d="M38 20 A15 15 0 1 0 40 30" stroke-width="3"/><path d="M38 9 V21 H26" stroke-width="3"/></svg>',
  drawers: SVG_OPEN+'<rect x="10" y="9" width="28" height="32" rx="3" fill="#bfe0d4"/><path d="M10 20 H38 M10 30 H38" stroke-width="2.5"/><circle cx="24" cy="14.5" r="1.8" fill="#5b6b63" stroke="none"/><circle cx="24" cy="25" r="1.8" fill="#5b6b63" stroke="none"/><circle cx="24" cy="35.5" r="1.8" fill="#5b6b63" stroke="none"/><path d="M40 8 L41 11 L44 12 L41 13 L40 16 L39 13 L36 12 L39 11 Z" fill="#ffe08c" stroke-width="1.2"/></svg>',
  glass: SVG_OPEN+'<circle cx="21" cy="21" r="12" fill="#d8efe6"/><path d="M30 30 L40 40" stroke-width="3.5"/></svg>',
  house: SVG_OPEN+'<rect x="11" y="22" width="26" height="18" fill="#d8efe6"/><path d="M7 24 L24 8 L41 24"/><path d="M11 40 H37"/><rect x="20.5" y="30" width="7" height="10" rx="1" fill="#9cc7b8"/></svg>',
};
const PRAISE = ["えらい！✨","すっきり！🫧","おつかれさま！🌿","ととのったね！😊","気持ちいい〜！💚","ナイス整頓！📦","おうちが喜んでる！🏠💚"];
const DONE_ALL = ["エリアぜんぶ完了！🎉","ここは完璧！✨🏆","まるごとスッキリ！すごい！💮"];

const DEFAULT = {
  projects: [
    {id:"p1", area:"クローゼット", tasks:[{id:"t1",name:"いらない服を選ぶ",done:false},{id:"t2",name:"たたみ直す",done:false},{id:"t3",name:"ハンガーをそろえる",done:false}], beforeImg:"", afterImg:""},
    {id:"p2", area:"子どものおもちゃ", tasks:[{id:"t4",name:"こわれたものを処分",done:false},{id:"t5",name:"種類ごとに分ける",done:false}], beforeImg:"", afterImg:""},
  ],
  discards: [],
  goal: 0,
  items: [],
  places: [
    {id:"m1", name:"玄関の収納", last:null},
    {id:"m2", name:"キッチンの引き出し", last:null},
    {id:"m3", name:"洗面所のストック", last:null},
    {id:"m4", name:"書類ボックス", last:null},
    {id:"m5", name:"押入れ", last:null},
  ],
};

let state = load();

function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY));
    if(s && s.projects){
      if(!Array.isArray(s.discards)) s.discards=[];
      if(!Array.isArray(s.items)) s.items=[];
      if(!Array.isArray(s.places)) s.places=[];
      if(typeof s.goal!=="number") s.goal=0;
      return s;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function pad2(n){ return String(n).padStart(2,"0"); }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function daysAgo(ds){ const a=new Date(ds+"T00:00:00"), b=new Date(todayStr()+"T00:00:00"); return Math.round((b-a)/86400000); }

let openProj = new Set(JSON.parse(sessionStorage.getItem("seiri-open")||"[]"));
function saveOpen(){ sessionStorage.setItem("seiri-open", JSON.stringify([...openProj])); }

/* ===== 片付け ===== */
function renderKata(){
  const el = document.getElementById("pageKata");
  let html = '<div class="sec-note">エリアごとに やることを 分けて、ちょっとずつ片付けよう。写真で before / after も残せるよ📷</div>';
  if(!state.projects.length){
    html += '<div class="empty">まだエリアがないよ。<br>下から追加してみよう！</div>';
  }
  state.projects.forEach(function(p, pi){
    const total = p.tasks.length, done = p.tasks.filter(function(t){return t.done;}).length;
    const pct = total ? Math.round(done/total*100) : 0;
    const isOpen = openProj.has(p.id);
    html += '<div class="card'+(isOpen?" open":"")+'">'
      + '<div class="proj-head" onclick="toggleProj('+pi+')">'
      +   '<span class="picon">'+ICONS.box+'</span>'
      +   '<div style="flex:1;min-width:0"><div class="pname">'+esc(p.area)+'</div></div>'
      +   '<span class="pcount">'+done+'/'+total+'</span><span class="arrow">▶</span>'
      + '</div>'
      + '<div class="pbar"><span style="width:'+pct+'%"></span></div>'
      + '<div class="proj-body">'
      +   p.tasks.map(function(t, ti){
            return '<div class="task'+(t.done?" done":"")+'">'
              + '<button class="check" onclick="toggleTask('+pi+','+ti+',event)">✓</button>'
              + '<div class="tname">'+esc(t.name)+'</div>'
              + '<button class="tdel" onclick="delTask('+pi+','+ti+')">✕</button></div>';
          }).join("")
      +   '<div class="row-add"><input id="taskIn'+pi+'" type="text" placeholder="やることを追加" maxlength="24" onkeydown="if(event.key===\'Enter\')addTask('+pi+')"><button onclick="addTask('+pi+')">追加</button></div>'
      +   '<div class="photos">'
      +     photoBox(pi,"before",p.beforeImg)
      +     photoBox(pi,"after",p.afterImg)
      +   '</div>'
      +   '<div class="proj-foot"><button onclick="delProj('+pi+')">このエリアを削除</button></div>'
      + '</div></div>';
  });
  html += '<div class="add-big"><input id="projIn" type="text" placeholder="エリアを追加（例：押入れ）" maxlength="20" onkeydown="if(event.key===\'Enter\')addProj()"><button onclick="addProj()">追加</button></div>';
  el.innerHTML = html;
}
function photoBox(pi, which, img){
  const lab = which==="before" ? "Before" : "After";
  let inner;
  if(img){ inner = '<img src="'+img+'"><button class="rm" onclick="rmPhoto('+pi+',\''+which+'\',event)">✕</button>'; }
  else { inner = '＋ 写真'; }
  return '<div class="photo"><div class="plabel">'+lab+'</div><div class="pbox" onclick="pickPhoto('+pi+',\''+which+'\')">'+inner+'</div></div>';
}
function toggleProj(pi){ const id=state.projects[pi].id; openProj.has(id)?openProj.delete(id):openProj.add(id); saveOpen(); renderKata(); }
function toggleTask(pi, ti, ev){
  ev.stopPropagation();
  const p = state.projects[pi], t = p.tasks[ti];
  t.done = !t.done; save();
  if(t.done){
    const all = p.tasks.every(function(x){return x.done;});
    toast(all ? DONE_ALL[Math.floor(Math.random()*DONE_ALL.length)] : PRAISE[Math.floor(Math.random()*PRAISE.length)]);
    confetti(ev);
  }
  renderKata();
}
function addTask(pi){
  const inp = document.getElementById("taskIn"+pi); const name = inp.value.trim(); if(!name) return;
  state.projects[pi].tasks.push({id:uid(), name:name, done:false});
  openProj.add(state.projects[pi].id); saveOpen(); save(); renderKata();
}
function delTask(pi, ti){ state.projects[pi].tasks.splice(ti,1); save(); renderKata(); }
function addProj(){
  const inp = document.getElementById("projIn"); const area = inp.value.trim(); if(!area) return;
  const p = {id:uid(), area:area, tasks:[], beforeImg:"", afterImg:""};
  state.projects.push(p); openProj.add(p.id); saveOpen(); save(); renderKata();
  toast("「"+area+"」を追加したよ🌱");
}
function delProj(pi){
  if(!confirm("「"+state.projects[pi].area+"」を削除する？")) return;
  state.projects.splice(pi,1); save(); renderKata();
}
function pickPhoto(pi, which){
  const inp = document.createElement("input"); inp.type="file"; inp.accept="image/*";
  inp.onchange = function(){
    const f = inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = function(){
      const img = new Image();
      img.onload = function(){
        let w=img.width, h=img.height, mx=900;
        if(w>h && w>mx){ h=Math.round(h*mx/w); w=mx; } else if(h>=w && h>mx){ w=Math.round(w*mx/h); h=mx; }
        const c = document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        const data = c.toDataURL("image/jpeg", 0.7);
        const p = state.projects[pi]; if(!p) return;
        if(which==="before") p.beforeImg=data; else p.afterImg=data;
        save(); renderKata(); toast("写真を追加したよ📷");
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}
function rmPhoto(pi, which, ev){
  ev.stopPropagation();
  const p = state.projects[pi];
  if(which==="before") p.beforeImg=""; else p.afterImg="";
  save(); renderKata();
}

/* ===== 断捨離 ===== */
function renderDan(){
  const el = document.getElementById("pageDan");
  const t = todayStr(), ym = t.slice(0,7);
  const monthN = state.discards.filter(function(d){return d.date.startsWith(ym);}).length;
  const days = new Set(state.discards.map(function(d){return d.date;}));
  let streak=0, cur=new Date(t+"T00:00:00");
  if(!days.has(t)) cur.setDate(cur.getDate()-1);
  while(days.has(cur.getFullYear()+"-"+pad2(cur.getMonth()+1)+"-"+pad2(cur.getDate()))){ streak++; cur.setDate(cur.getDate()-1); }
  const totalN = state.discards.length;

  let html = '<div class="summary">'
    + '<div class="box"><div class="num">'+monthN+'</div><div class="label">今月 手放した</div></div>'
    + '<div class="box"><div class="num">'+streak+'</div><div class="label">連続日数</div></div>'
    + '<div class="box"><div class="num">'+totalN+'</div><div class="label">ぜんぶで</div></div>'
    + '</div>';

  const goal = state.goal||0;
  const gpct = goal ? Math.min(100, Math.round(monthN/goal*100)) : 0;
  html += '<div class="card goal-card">'
    + '<div class="gtop"><span>今月の目標'+(goal? '：'+monthN+' / '+goal+' 個' : 'は未設定')+'</span><button class="gset" onclick="setGoal()">'+(goal?'変更':'設定する')+'</button></div>'
    + (goal? '<div class="goal-bar"><span style="width:'+gpct+'%"></span></div>' : '')
    + '</div>';

  html += '<div class="add-big"><input id="danIn" type="text" placeholder="手放したもの（例：着ない服）" maxlength="30" onkeydown="if(event.key===\'Enter\')addDiscard()"><button onclick="addDiscard()">手放す</button></div>';
  html += '<div class="sec-note">名前はなくてもOK。ボタンを押すと今日の分として記録するよ。</div>';

  if(!state.discards.length){
    html += '<div class="empty">まだ記録がないよ。<br>ひとつ手放してみよう！</div>';
  } else {
    const byDay = {};
    state.discards.slice().reverse().forEach(function(d){ (byDay[d.date]=byDay[d.date]||[]).push(d); });
    Object.keys(byDay).forEach(function(date){
      const dd = new Date(date+"T00:00:00");
      const wd = ["日","月","火","水","木","金","土"][dd.getDay()];
      const ago = daysAgo(date);
      const lab = (ago===0?"今日":ago===1?"きのう":(dd.getMonth()+1)+"月"+dd.getDate()+"日("+wd+")") + " ・ " + byDay[date].length + "個";
      html += '<div class="day-group"><h3>'+lab+'</h3>'
        + byDay[date].map(function(d){
            return '<div class="d-item"><span>'+esc(d.name||"（名前なし）")+'</span><button class="ddel" onclick="delDiscard(\''+d.id+'\')">✕</button></div>';
          }).join("")
        + '</div>';
    });
  }
  el.innerHTML = html;
}
function addDiscard(){
  const inp = document.getElementById("danIn"); const name = inp ? inp.value.trim() : "";
  state.discards.push({id:uid(), name:name, date:todayStr()});
  save(); renderDan();
  toast(PRAISE[Math.floor(Math.random()*PRAISE.length)]);
}
function delDiscard(id){
  const i = state.discards.findIndex(function(d){return d.id===id;}); if(i<0) return;
  state.discards.splice(i,1); save(); renderDan();
}
function setGoal(){
  const cur = state.goal||0;
  const v = prompt("今月の目標個数を入力してね（0でなし）", cur? String(cur):"");
  if(v===null) return;
  const n = parseInt(v,10);
  state.goal = (isNaN(n)||n<0) ? 0 : n;
  save(); renderDan();
}

/* ===== 定位置 ===== */
let teiiSearch = "";
function renderTeii(){
  const el = document.getElementById("pageTeii");
  let html = '<div class="search-box">'+ICONS.glass+'<input id="teiiSearch" type="text" placeholder="ものの名前や場所でさがす" value="'+esc(teiiSearch)+'" oninput="onTeiiSearch(this.value)"></div>';

  let items = state.items.slice();
  if(teiiSearch){
    const q = teiiSearch.toLowerCase();
    items = items.filter(function(it){ return (it.name||"").toLowerCase().indexOf(q)>=0 || (it.place||"").toLowerCase().indexOf(q)>=0 || (it.cat||"").toLowerCase().indexOf(q)>=0; });
  }
  if(!state.items.length){
    html += '<div class="empty">「これはここ」を登録すると<br>あとで場所をすぐ思い出せるよ📍</div>';
  } else if(!items.length){
    html += '<div class="empty">見つからなかったよ🔍</div>';
  } else {
    const byCat = {};
    items.forEach(function(it){ const c = it.cat||"その他"; (byCat[c]=byCat[c]||[]).push(it); });
    Object.keys(byCat).forEach(function(cat){
      html += '<div class="cat-group"><h3>'+esc(cat)+'</h3>'
        + byCat[cat].map(function(it){
            return '<div class="i-item"><div class="iinfo"><div class="iname">'+esc(it.name)+'</div><div class="iplace">'+ICONS.pin+esc(it.place||"（場所みてい）")+'</div></div><button class="idel" onclick="delItem(\''+it.id+'\')">✕</button></div>';
          }).join("")
        + '</div>';
    });
  }

  html += '<div class="item-add">'
    + '<div class="fld"><label>もの</label><input id="itName" type="text" placeholder="例：予備の電池" maxlength="30"></div>'
    + '<div class="fld"><label>しまう場所</label><input id="itPlace" type="text" placeholder="例：キッチン下の引き出し" maxlength="30"></div>'
    + '<div class="fld"><label>カテゴリ（なくてもOK）</label><input id="itCat" type="text" placeholder="例：日用品" maxlength="16" list="catList"></div>'
    + '<datalist id="catList"><option>書類</option><option>文具</option><option>日用品</option><option>子ども用品</option><option>工具・電池</option><option>季節もの</option><option>思い出</option><option>その他</option></datalist>'
    + '<button class="iadd-btn" onclick="addItem()">登録する</button>'
    + '</div>';
  el.innerHTML = html;
}
function onTeiiSearch(v){
  teiiSearch = v;
  const el = document.getElementById("pageTeii");
  // re-render only list part would be nicer, but keep simple; preserve focus
  const active = document.activeElement===document.getElementById("teiiSearch");
  renderTeii();
  if(active){ const s=document.getElementById("teiiSearch"); s.focus(); s.setSelectionRange(s.value.length,s.value.length); }
}
function addItem(){
  const name = document.getElementById("itName").value.trim();
  const place = document.getElementById("itPlace").value.trim();
  const cat = document.getElementById("itCat").value.trim() || "その他";
  if(!name){ toast("ものの名前を入れてね"); return; }
  state.items.push({id:uid(), name:name, place:place, cat:cat});
  teiiSearch = ""; save(); renderTeii();
  toast("「"+name+"」を登録したよ📍");
}
function delItem(id){
  const i = state.items.findIndex(function(x){return x.id===id;}); if(i<0) return;
  if(!confirm("「"+state.items[i].name+"」を削除する？")) return;
  state.items.splice(i,1); save(); renderTeii();
}

/* ===== 見直し ===== */
function minaStatus(last){
  if(!last) return {cls:"none", text:"まだ見直してないよ"};
  const d = daysAgo(last);
  if(d===0) return {cls:"ok", text:"今日 見直したよ✨"};
  if(d<=14) return {cls:"ok", text:d+"日前"};
  if(d<=30) return {cls:"warn", text:d+"日前 そろそろかも"};
  return {cls:"bad", text:d+"日前 見直しどき！"};
}
function renderMina(){
  const el = document.getElementById("pageMina");
  let html = '<div class="sec-note">収納場所を ときどき見直して、ためこみ防止🌿「見直した」を押すと日付が記録されるよ。</div>';
  if(!state.places.length){
    html += '<div class="empty">場所がないよ。<br>下から追加してね。</div>';
  }
  state.places.forEach(function(pl, i){
    const st = minaStatus(pl.last);
    html += '<div class="m-item"><div class="minfo"><div class="mname">'+esc(pl.name)+'</div><div class="mlast '+st.cls+'">'+st.text+'</div></div>'
      + '<button class="mbtn" onclick="doMina('+i+')">見直した✓</button>'
      + '<button class="mdel" onclick="delMina('+i+')">✕</button></div>';
  });
  html += '<div class="add-big"><input id="minaIn" type="text" placeholder="場所を追加（例：本棚）" maxlength="20" onkeydown="if(event.key===\'Enter\')addMina()"><button onclick="addMina()">追加</button></div>';
  el.innerHTML = html;
}
function doMina(i){ state.places[i].last = todayStr(); save(); renderMina(); toast(PRAISE[Math.floor(Math.random()*PRAISE.length)]); }
function addMina(){
  const inp = document.getElementById("minaIn"); const name = inp.value.trim(); if(!name) return;
  state.places.push({id:uid(), name:name, last:null}); save(); renderMina();
  toast("「"+name+"」を追加したよ🌱");
}
function delMina(i){
  if(!confirm("「"+state.places[i].name+"」を削除する？")) return;
  state.places.splice(i,1); save(); renderMina();
}

/* ===== 共通 ===== */
function showPage(name){
  document.querySelectorAll(".page").forEach(function(p){p.classList.remove("active");});
  document.querySelectorAll(".tabbar button").forEach(function(b){b.classList.remove("active");});
  document.getElementById("page"+name).classList.add("active");
  document.getElementById("tab"+name).classList.add("active");
  if(name==="Kata") renderKata();
  if(name==="Dan") renderDan();
  if(name==="Teii") renderTeii();
  if(name==="Mina") renderMina();
}
let toastTimer;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove("show");},1800); }
function confetti(ev){
  const x = ev&&ev.clientX?ev.clientX:window.innerWidth/2, y = ev&&ev.clientY?ev.clientY:window.innerHeight/2;
  const chars=["✨","🫧","🌿","⭐","📦"];
  for(let i=0;i<6;i++){ const s=document.createElement("span"); s.className="confetti"; s.textContent=chars[Math.floor(Math.random()*chars.length)]; s.style.left=(x+(Math.random()*70-35))+"px"; s.style.top=(y-10-Math.random()*20)+"px"; document.body.appendChild(s); setTimeout(function(){s.remove();},1200); }
}

document.getElementById("hIcon").innerHTML = ICONS.drawers;
document.querySelectorAll(".ico[data-icon]").forEach(function(el){ el.innerHTML = ICONS[el.dataset.icon]; });
renderKata();

<script>
(function(){
  var APP="seiri";
  document.getElementById("bkxExp").addEventListener("click",function(){
    var data={};
    for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); data[k]=localStorage.getItem(k); }
    var blob=new Blob([JSON.stringify({__bkx:APP,data:data},null,2)],{type:"application/json"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    var d=new Date();
    a.download=APP+"-backup-"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+".json";
    a.click(); URL.revokeObjectURL(a.href);
  });
  document.getElementById("bkxImpBtn").addEventListener("click",function(){ document.getElementById("bkxImp").click(); });
  document.getElementById("bkxImp").addEventListener("change",function(ev){
    var f=ev.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var j=JSON.parse(r.result);
        var data=j.__bkx?j.data:j;
        if(typeof data!=="object"||!data) throw 0;
        if(!confirm("今の記録を読み込んだ内容で置き換えます。よろしいですか？")) return;
        Object.keys(data).forEach(function(k){ localStorage.setItem(k,data[k]); });
        alert("読み込みました。画面を更新します。"); location.reload();
      }catch(e){ alert("このファイルは読み込めませんでした"); }
    };
    r.readAsText(f); ev.target.value="";
  });
})();
</script>
